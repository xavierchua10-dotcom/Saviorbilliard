<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0014">
<title>8-Ball Pool — Savior Cue Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #05010f;
    --panel: rgba(16, 4, 38, 0.92);
    --pink: #ff2fd8;
    --purple: #8b2fff;
    --cyan: #23e8ff;
    --text-main: #f2ecff;
    --text-muted: #a996d1;
    --felt: #1a4d8c;
    --cushion: #121f3d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; min-height: 100vh; background: var(--void); color: var(--text-main);
    font-family: 'Rajdhani', sans-serif; display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden; padding-bottom: 2rem;
  }

  .nav-bar {
    width: 100%; max-width: 1100px; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; z-index: 10;
  }
  .back-btn {
    font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 700; color: var(--cyan);
    text-decoration: none; padding: 0.5rem 1rem; border: 1px solid var(--cyan); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    background: rgba(35, 232, 255, 0.1); transition: all 0.2s; display: flex; align-items: center; gap: 0.4rem;
  }
  .back-btn:hover { background: var(--cyan); color: var(--void); box-shadow: 0 0 15px var(--cyan); }

  .game-title {
    font-family: 'Press Start 2P', monospace; font-size: clamp(0.9rem, 2.5vw, 1.4rem); color: var(--text-main);
    text-shadow: 0 0 10px var(--pink), 0 0 20px var(--purple); margin: 0;
  }

  .sound-btn {
    background: rgba(255, 47, 216, 0.1); border: 1px solid var(--pink); color: var(--pink);
    padding: 0.5rem 0.8rem; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); transition: all 0.2s;
  }
  .sound-btn.is-on { background: rgba(35, 232, 255, 0.2); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }

  .dash {
    width: 95%; max-width: 1000px; background: var(--panel); border: 1px solid rgba(139, 47, 255, 0.4);
    border-radius: 8px; padding: 0.8rem 1.2rem; margin-bottom: 1rem; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;
    box-shadow: 0 0 20px rgba(139, 47, 255, 0.2);
  }
  .score-box { display: flex; align-items: center; gap: 1.5rem; font-family: 'Orbitron', sans-serif; }
  .player-card { display: flex; flex-direction: column; align-items: flex-start; }
  .player-card.active { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  .player-name { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }
  .player-card.active .player-name { color: var(--cyan); }
  .player-pts { font-size: 1.1rem; font-weight: 800; color: var(--pink); }

  .status-text {
    font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: var(--pink); font-weight: 600; letter-spacing: 0.05em; text-align: center;
  }

  .mode-controls { display: flex; align-items: center; gap: 0.6rem; }
  .btn-opt {
    font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 700; padding: 0.4rem 0.8rem;
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--purple); color: var(--text-muted); cursor: pointer;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); transition: all 0.2s;
  }
  .btn-opt.active { background: var(--purple); color: #fff; border-color: var(--pink); box-shadow: 0 0 10px var(--pink); }

  .table-wrapper {
    position: relative; width: 95%; max-width: 1000px; aspect-ratio: 2 / 1; background: #000; border-radius: 12px;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), 0 0 1px 2px #2b3d6b; overflow: hidden; touch-action: none;
  }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }

  @media (max-width: 700px) and (orientation: portrait) {
    .table-wrapper { width: min(88vw, 36vh); max-width: none; aspect-ratio: 1 / 2; }
  }

  /* AI Thinking overlay: centered over the table, hidden on the player's turn.
     Static fade in/out only — no pulsing, no neon glow. The avatar sticker and
     caption bar are set together in JS each time this activates. */
  .ai-thinking-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6em;
    pointer-events: none; opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease; z-index: 5;
  }
  .ai-thinking-overlay.is-active { opacity: 1; visibility: visible; }
  /* Character sticker: plain flat art, no glow/drop-shadow. Its src is only ever
     set once per activation in JS (never on a timer), so nothing flickers. */
  .ai-thinking-overlay .ai-thinking-avatar {
    height: clamp(96px, 26vw, 230px); width: auto; max-width: 78%; object-fit: contain;
    -webkit-backface-visibility: hidden; backface-visibility: hidden; transform: translateZ(0);
    pointer-events: none; -webkit-user-drag: none; user-select: none;
  }
  /* Caption bar: white panel, black text, no glow/text-shadow — reads like a
     plain dialogue/subtitle bar rather than a neon HUD element. */
  .ai-thinking-overlay .ai-thinking-text {
    font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 0.03em; text-align: center;
    max-width: 88%; white-space: normal; font-size: clamp(0.75rem, 2.8vw, 1.15rem); color: #14141a;
    background: #ffffff; border: 1px solid rgba(0,0,0,0.15); border-radius: 8px; padding: 0.55em 1.1em;
  }

  @media (max-width: 700px) and (orientation: portrait) {
    .ai-thinking-overlay .ai-thinking-avatar { height: clamp(84px, 38vw, 190px); }
  }

  .controls-bar {
    width: 95%; max-width: 1000px; margin-top: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    background: var(--panel); border: 1px solid rgba(35, 232, 255, 0.3); padding: 0.8rem 1.2rem; border-radius: 8px;
  }
  .power-wrap { flex: 1; display: flex; flex-direction: column; gap: 0.3rem; }
  .power-label { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.1em; }
  .power-slider {
    width: 100%; -webkit-appearance: none; appearance: none; height: 10px; background: #1a0f30; border-radius: 5px; outline: none; border: 1px solid var(--purple);
  }
  .power-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--cyan); cursor: pointer; box-shadow: 0 0 10px var(--cyan);
  }
  .shoot-btn {
    font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 800; padding: 0.7rem 1.8rem; color: #0a0014;
    background: linear-gradient(90deg, var(--pink), var(--cyan)); border: none; cursor: pointer;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    box-shadow: 0 0 15px var(--pink); transition: transform 0.1s, box-shadow 0.2s;
  }
  .shoot-btn:active { transform: scale(0.96); }

  @media (max-width: 700px) {
    .dash { flex-direction: column; align-items: stretch; gap: 0.6rem; }
    .score-box { justify-content: space-between; }
    .mode-controls { justify-content: center; flex-wrap: wrap; }
    .controls-bar { flex-wrap: wrap; }
    .shoot-btn { flex: 1; min-width: 120px; }
  }

  /* ---- Intro cutscene: character + speech bubble storyline shown once
     before the match starts. Full-viewport overlay so it sits on top of
     (and blocks) the game UI beneath it until dismissed. ---- */
  .intro-overlay {
    position: fixed; inset: 0; z-index: 999; display: flex; flex-direction: column;
    opacity: 1; visibility: visible; transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  .intro-overlay.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .intro-backdrop {
    position: absolute; inset: 0; background: rgba(5, 1, 15, 0.85);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .intro-stage {
    position: relative; z-index: 1; flex: 1; display: flex; align-items: flex-end; justify-content: center;
    gap: 1.2rem; padding: 1.2rem 1.2rem 0.6rem; flex-wrap: wrap;
  }
  .intro-character {
    height: clamp(190px, 40vw, 420px); width: auto; max-width: 40%; object-fit: contain; flex-shrink: 0;
    opacity: 0; transform: translateY(14px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    -webkit-backface-visibility: hidden; backface-visibility: hidden; transform: translateZ(0);
    pointer-events: none; -webkit-user-drag: none; user-select: none;
  }
  .intro-character.is-visible { opacity: 1; transform: translateY(0) translateZ(0); }
  .intro-bubble {
    position: relative; background: #ffffff; color: #111318; border-radius: 16px;
    padding: 1rem 1.3rem; max-width: 460px; margin-bottom: clamp(30px, 10vw, 90px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity: 0; transform: translateY(8px) scale(0.97);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .intro-bubble.is-visible { opacity: 1; transform: translateY(0) scale(1); }
  .intro-bubble::after {
    content: ''; position: absolute; left: 30px; bottom: -13px;
    border-width: 13px 9px 0 9px; border-style: solid; border-color: #ffffff transparent transparent transparent;
  }
  .intro-bubble-text {
    font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: clamp(0.82rem, 2.5vw, 1.05rem);
    line-height: 1.55; margin: 0; color: #111318;
  }
  .intro-controls {
    position: relative; z-index: 1; display: flex; justify-content: flex-end; align-items: center;
    gap: 0.6rem; padding: 0 1.2rem 1.2rem;
  }
  .intro-btn {
    font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 0.7rem; letter-spacing: 0.08em;
    padding: 0.6em 1.1em; border-radius: 6px; cursor: pointer; border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.08); color: #fff; transition: background 0.15s ease, transform 0.1s ease;
  }
  .intro-btn:hover { background: rgba(255,255,255,0.18); }
  .intro-btn:active { transform: scale(0.96); }
  .intro-btn-next {
    background: linear-gradient(90deg, var(--pink), var(--cyan)); color: #0a0014; border: none;
  }
  .intro-countdown {
    position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .intro-countdown.is-active { opacity: 1; visibility: visible; }
  .intro-countdown span {
    font-family: 'Orbitron', sans-serif; font-weight: 900; color: #fff; text-align: center;
    font-size: clamp(2.6rem, 13vw, 6.5rem); text-shadow: 0 0 30px var(--pink), 0 0 60px var(--purple);
  }
  .intro-countdown span.pop { animation: introCountdownPop 0.45s ease; }
  @keyframes introCountdownPop {
    0% { transform: scale(0.5); opacity: 0; }
    55% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 700px) {
    .intro-stage { flex-direction: column; align-items: center; justify-content: flex-end; padding: 1rem 1rem 0.4rem; }
    .intro-character { max-width: 70%; height: clamp(150px, 44vw, 260px); }
    .intro-bubble { margin-bottom: 0; max-width: 94vw; }
    .intro-bubble::after { left: 50%; margin-left: -9px; }
    .intro-controls { justify-content: center; padding: 0.8rem 1rem 1.2rem; }
  }
</style>
</head>
<body>

  <div class="nav-bar">
    <a href="index.html" class="back-btn">◀ HALL MENU</a>
    <h1 class="game-title">8-BALL POOL</h1>
    <button id="soundBtn" class="sound-btn is-on">🔊 LOFI SOUND</button>
  </div>

  <div class="dash">
    <div class="score-box">
      <div id="p1Card" class="player-card active">
        <span class="player-name" id="p1Name">PLAYER 1</span>
        <span class="player-pts" id="p1Group">OPEN TABLE</span>
      </div>
      <span class="vs-badge">VS</span>
      <div id="p2Card" class="player-card">
        <span class="player-name" id="p2Name">AI (MED)</span>
        <span class="player-pts" id="p2Group">OPEN TABLE</span>
      </div>
    </div>

    <div class="status-text" id="statusText">BREAK THE RACK!</div>

    <div class="mode-controls">
      <button class="btn-opt" id="btnVsAi">VS AI</button>
      <button class="btn-opt active" id="btnDiff">DIFF: MED</button>
      <button class="btn-opt" id="btn2P">2 PLAYER</button>
      <button class="btn-opt" id="btnReset">RACK</button>
    </div>
  </div>

  <div class="table-wrapper">
    <canvas id="gameCanvas" width="1000" height="500"></canvas>
    <div id="aiThinkingOverlay" class="ai-thinking-overlay" aria-hidden="true">
      <img id="aiThinkingAvatar" class="ai-thinking-avatar" alt="" draggable="false">
      <span class="ai-thinking-text">Is that what you got?</span>
    </div>
  </div>

  <div class="controls-bar">
    <div class="power-wrap">
      <div style="display:flex; justify-content:space-between;">
        <span class="power-label">SHOT POWER</span>
        <span class="power-label" id="powerVal">50%</span>
      </div>
      <input type="range" id="powerSlider" class="power-slider" min="10" max="100" value="50">
    </div>
    <button id="shootBtn" class="shoot-btn">STRIKE</button>
  </div>

  <!-- Intro cutscene: Savior greets the player before the match. Unlike the
       9-ball table (game1), the sticker + line for each of the 3 dialogue
       beats is picked at random from a pool every time the page loads, so
       the intro is different (and hopefully funnier) each playthrough.
       Player can click NEXT to advance a beat early, or SKIP to jump
       straight to the countdown. -->
  <div id="introOverlay" class="intro-overlay" aria-hidden="false">
    <div class="intro-backdrop"></div>
    <div class="intro-stage">
      <img id="introCharacter" class="intro-character" src="" alt="" draggable="false">
      <div id="introBubble" class="intro-bubble">
        <p id="introText" class="intro-bubble-text"></p>
      </div>
    </div>
    <div class="intro-controls">
      <button id="introSkipBtn" class="intro-btn intro-btn-skip">SKIP</button>
      <button id="introNextBtn" class="intro-btn intro-btn-next">NEXT ▶</button>
    </div>
    <div id="introCountdown" class="intro-countdown">
      <span id="introCountdownText"></span>
    </div>
  </div>

const INTRO_IMG_POOL = [
  SAVIOR_THINKING_STICKERS[0],
  SAVIOR_THINKING_STICKERS[1],
  SAVIOR_THINKING_STICKERS[2],
  INTRO_IMG_WAVE,
  INTRO_IMG_STERN,
  INTRO_IMG_THUMBSUP
];

// Bank of funny/trash-talk lines. Three are chosen at random (no repeats)
// and paired with three randomly chosen stickers each time the page loads,
// so the pre-game intro plays out a little differently every time.
const INTRO_LINE_POOL = [
  "Oh look, another challenger... how original.",
  "Fair warning: I've been playing pool since before I could reach the table.",
  "Pool, snooker, whatever you call it — I call it Tuesday.",
  "Rack 'em up, buttercup. This ball's about to fly.",
  "Fun fact: my chalk has never once missed.",
  "I once beat myself at this game. True story, don't ask.",
  "My aim is basically a certified weapon at this point.",
  "You brought confidence? Cute. I brought a plan.",
  "Let's make this quick, I've got a nap scheduled right after.",
  "Warning: excessive trash talk ahead. Proceed at your own risk.",
  "I'd wish you luck, but we both know you're gonna need a miracle.",
  "Step right up — the arena's open and my ego's fully charged."
];

function introShuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Reading-time estimate so longer random lines linger a bit longer on screen.
function introHoldFor(text) {
  return Math.max(2400, Math.min(5200, 2200 + text.length * 45));
}

function introBuildRandomSteps() {
  const images = introShuffle(INTRO_IMG_POOL).slice(0, 3);
  const lines = introShuffle(INTRO_LINE_POOL).slice(0, 3);
  return images.map((img, i) => ({ img, text: lines[i], duration: introHoldFor(lines[i]) }));
}

const INTRO_STEPS = introBuildRandomSteps();

let introStepIndex = -1;
let introTimer = null;
let introActive = true; // blocks nothing on its own — the overlay's own hit-testing does that

function introShowStep(i) {
  clearTimeout(introTimer);
  if (i >= INTRO_STEPS.length) { introStartCountdown(); return; }
  introStepIndex = i;
  const step = INTRO_STEPS[i];
  const charEl = document.getElementById('introCharacter');
  const bubbleEl = document.getElementById('introBubble');
  const textEl = document.getElementById('introText');
  const nextBtn = document.getElementById('introNextBtn');

  charEl.classList.remove('is-visible');
  bubbleEl.classList.remove('is-visible');

  const swapDelay = (i === 0) ? 0 : 180;
  setTimeout(() => {
    charEl.src = step.img;
    textEl.textContent = step.text;
    requestAnimationFrame(() => {
      charEl.classList.add('is-visible');
      bubbleEl.classList.add('is-visible');
    });
  }, swapDelay);

  nextBtn.textContent = (i === INTRO_STEPS.length - 1) ? 'CONTINUE ▶' : 'NEXT ▶';
  introTimer = setTimeout(() => { introShowStep(i + 1); }, swapDelay + step.duration);
}

function introNext() {
  clearTimeout(introTimer);
  introShowStep(introStepIndex + 1);
}

function introSkip() {
  clearTimeout(introTimer);
  introStartCountdown();
}

function introStartCountdown() {
  clearTimeout(introTimer);
  document.getElementById('introCharacter').classList.remove('is-visible');
  document.getElementById('introBubble').classList.remove('is-visible');
  const controls = document.querySelector('.intro-controls');
  if (controls) controls.style.display = 'none';

  const cd = document.getElementById('introCountdown');
  const cdText = document.getElementById('introCountdownText');
  cd.classList.add('is-active');

  const sequence = [
    { text: '3', hold: 700 },
    { text: '2', hold: 700 },
    { text: '1', hold: 700 },
    { text: 'GAME START', hold: 950 }
  ];
  let idx = 0;
  function tick() {
    const step = sequence[idx];
    cdText.textContent = step.text;
    cdText.classList.remove('pop');
    void cdText.offsetWidth; // restart the pop animation
    cdText.classList.add('pop');
    idx++;
    if (idx < sequence.length) {
      introTimer = setTimeout(tick, step.hold);
    } else {
      introTimer = setTimeout(introFinish, step.hold);
    }
  }
  tick();
}

function introFinish() {
  introActive = false;
  const overlay = document.getElementById('introOverlay');
  overlay.classList.add('is-hidden');
  overlay.setAttribute('aria-hidden', 'true');
  AudioEngine.ensureStarted();
  setTimeout(() => { overlay.style.display = 'none'; }, 450);
}

document.getElementById('introNextBtn').addEventListener('click', introNext);
document.getElementById('introSkipBtn').addEventListener('click', introSkip);


const AudioEngine = (function(){
  let ctx, master, isMuted = false;
  function init(){
    if(ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.2;
      master.connect(ctx.destination);
    }
  }

  function playClack(intensity = 1.0){
    if(!ctx || isMuted) return;
    if(ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1500 + Math.random()*250, now);
    osc.frequency.exponentialRampToValueAtTime(180, now + 0.04);
    g.gain.setValueAtTime(0.7 * Math.min(intensity, 1), now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + 0.05);
  }

  function playPocket(){
    if(!ctx || isMuted) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.16);
    g.gain.setValueAtTime(0.8, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + 0.2);
  }

  let musicInterval = null;
  const CHORDS = [
    [220.00, 277.18, 329.63, 415.30],
    [185.00, 220.00, 277.18, 329.63],
    [146.83, 185.00, 220.00, 277.18],
    [164.81, 207.65, 246.94, 293.66]
  ];
  let chordIdx = 0;

  function startLofi(){
    if(musicInterval) return;
    init();
    musicInterval = setInterval(() => {
      if(!ctx || isMuted) return;
      const now = ctx.currentTime;
      const chord = CHORDS[chordIdx % CHORDS.length];
      chordIdx++;
      chord.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(0.045, now + 0.2);
        g.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
        osc.connect(g);
        g.connect(master);
        osc.start(now + i*0.05);
        osc.stop(now + 2.3);
      });
    }, 2800);
  }

  function toggleSound(){
    init();
    isMuted = !isMuted;
    if(!isMuted) startLofi();
    return !isMuted;
  }

  // Bug fix: the button defaulted to showing "ON", but browsers block audio until a real
  // user gesture, so nothing ever actually played — and the FIRST click on the button then
  // silently muted audio that was never audible. This starts real playback on the first
  // genuine interaction so the UI's default "ON" state is actually true.
  function ensureStarted(){
    init();
    // Some browsers (notably Safari/iOS) still create the AudioContext in a
    // 'suspended' state even when init() runs inside a genuine user gesture —
    // resume() here guarantees playback actually starts on that first tap.
    if(ctx && ctx.state === 'suspended') ctx.resume();
    if(!isMuted) startLofi();
  }

  return { init, playClack, playPocket, startLofi, toggleSound, ensureStarted };
})();

const Canvas = document.getElementById('gameCanvas');
const ctx = Canvas.getContext('2d');

// TABLE is mutable: dimensions get recomputed on layout changes (mobile portrait <-> desktop landscape).
// The long axis is always 900 "table units" and the short axis 400, regardless of which physical
// screen axis (x or y) they map to — this keeps every ball/pocket/line position valid across orientations.
const TABLE = { x: 50, y: 50, w: 900, h: 400, r: 12, friction: 0.985 };

let POCKETS = [];

// longIsX: true when the table's long dimension (900 units) currently runs horizontally (desktop/landscape).
// false when it runs vertically (mobile portrait) — i.e. the table is rotated 90°.
function longIsX() { return TABLE.w >= TABLE.h; }

// Converts abstract table coordinates (along the cue-to-triangle axis, across the centerline)
// into real canvas x/y for whichever orientation is currently active.
function P(along, across) {
  if (longIsX()) return { x: TABLE.x + along, y: TABLE.y + TABLE.h / 2 + across };
  return { x: TABLE.x + TABLE.w / 2 + across, y: TABLE.y + along };
}

// Inverse of P() — used to preserve ball positions when the orientation changes mid-game.
function unP(x, y) {
  if (longIsX()) return { along: x - TABLE.x, across: y - (TABLE.y + TABLE.h / 2) };
  return { along: y - TABLE.y, across: x - (TABLE.x + TABLE.w / 2) };
}

// Clamps a canvas-space point to inside the playable felt (accounting for ball radius).
// Used for ball-in-hand placement — in 8-ball, a foul lets you place the cue ball anywhere
// on the table (not restricted to a "D" like snooker).
function clampPointToTable(x, y) {
  const minX = TABLE.x + TABLE.r, maxX = TABLE.x + TABLE.w - TABLE.r;
  const minY = TABLE.y + TABLE.r, maxY = TABLE.y + TABLE.h - TABLE.r;
  return { x: Math.min(Math.max(x, minX), maxX), y: Math.min(Math.max(y, minY), maxY) };
}

function computePockets() {
  const cx = TABLE.x + TABLE.w / 2, cy = TABLE.y + TABLE.h / 2;
  if (longIsX()) {
    return [
      { x: TABLE.x, y: TABLE.y, r: 22 },
      { x: cx, y: TABLE.y - 4, r: 20 },
      { x: TABLE.x + TABLE.w, y: TABLE.y, r: 22 },
      { x: TABLE.x, y: TABLE.y + TABLE.h, r: 22 },
      { x: cx, y: TABLE.y + TABLE.h + 4, r: 20 },
      { x: TABLE.x + TABLE.w, y: TABLE.y + TABLE.h, r: 22 }
    ];
  }
  return [
    { x: TABLE.x, y: TABLE.y, r: 22 },
    { x: TABLE.x - 4, y: cy, r: 20 },
    { x: TABLE.x, y: TABLE.y + TABLE.h, r: 22 },
    { x: TABLE.x + TABLE.w, y: TABLE.y, r: 22 },
    { x: TABLE.x + TABLE.w + 4, y: cy, r: 20 },
    { x: TABLE.x + TABLE.w, y: TABLE.y + TABLE.h, r: 22 }
  ];
}

const mqPortrait = window.matchMedia('(max-width: 700px) and (orientation: portrait)');

function relayout() {
  const snapshot = balls.map(b => ({ ball: b, ...unP(b.x, b.y) }));

  const portrait = mqPortrait.matches;
  const W = portrait ? 500 : 1000;
  const H = portrait ? 1000 : 500;
  Canvas.width = W;
  Canvas.height = H;
  TABLE.x = 50; TABLE.y = 50; TABLE.w = W - 100; TABLE.h = H - 100;

  POCKETS = computePockets();

  if (balls.length) {
    snapshot.forEach(s => {
      const p = P(s.along, s.across);
      s.ball.x = p.x; s.ball.y = p.y;
    });
  }
}

  7: { color: '#882200', type: 'solid' },
  8: { color: '#111111', type: 'eight' },
  9: { color: '#ffcc00', type: 'stripe' },
  10: { color: '#0044ff', type: 'stripe' },
  11: { color: '#ff2222', type: 'stripe' },
  12: { color: '#8800cc', type: 'stripe' },
  13: { color: '#ff6600', type: 'stripe' },
  14: { color: '#009933', type: 'stripe' },
  15: { color: '#882200', type: 'stripe' }
};

class Ball {
  constructor(num, x, y) {
    this.num = num;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.info = BALL_COLORS[num];
    this.inPocket = false;
    this.rotationAngle = Math.random() * Math.PI * 2;
    this.rollDir = 0;
  }

  update() {
    if(this.inPocket) return;
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= TABLE.friction;
    this.vy *= TABLE.friction;

    const speed = Math.hypot(this.vx, this.vy);
    if(speed > 0.05) {
      this.rotationAngle += speed / TABLE.r;
      this.rollDir = Math.atan2(this.vy, this.vx);
    } else {
      this.vx = 0; this.vy = 0;
    }

    const minX = TABLE.x + TABLE.r;
    const maxX = TABLE.x + TABLE.w - TABLE.r;
    const minY = TABLE.y + TABLE.r;
    const maxY = TABLE.y + TABLE.h - TABLE.r;

    if(this.x < minX) { this.x = minX; this.vx *= -0.85; AudioEngine.playClack(Math.abs(this.vx)); }
    if(this.x > maxX) { this.x = maxX; this.vx *= -0.85; AudioEngine.playClack(Math.abs(this.vx)); }
    if(this.y < minY) { this.y = minY; this.vy *= -0.85; AudioEngine.playClack(Math.abs(this.vy)); }
    if(this.y > maxY) { this.y = maxY; this.vy *= -0.85; AudioEngine.playClack(Math.abs(this.vy)); }
  }

  draw() {
    if(this.inPocket) return;
    ctx.save();

    // 1. Shadow underneath
    ctx.beginPath();
    ctx.arc(this.x + 3, this.y + 3, TABLE.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();

    // Clip to spherical boundary
    ctx.beginPath();
    ctx.arc(this.x, this.y, TABLE.r, 0, Math.PI*2);
    ctx.clip();

    // Solid surface base
    ctx.fillStyle = this.info.color;
    ctx.fill();

    // 2. Rotating 3D Surface (Stripes, Numbers, Cue Alignment Dot)
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rollDir);

    const patternOffset = Math.sin(this.rotationAngle) * (TABLE.r * 0.7);
    const patternScale = Math.cos(this.rotationAngle);

    if(this.info.type === 'stripe') {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-TABLE.r, patternOffset - TABLE.r * 0.35, TABLE.r * 2, TABLE.r * 0.7);
    }

    if(this.num !== 0) {
      if(patternScale > -0.2) {
        ctx.save();
        ctx.translate(0, patternOffset);
        ctx.scale(1, Math.abs(patternScale));
        
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.font = 'bold 7px Orbitron';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.num, 0, 0);
        ctx.restore();
      }
    } else {
      // Cue ball rotation indicator dot
      if(patternScale > -0.2) {
        ctx.fillStyle = '#ff2fd8';
        ctx.beginPath();
        ctx.arc(patternOffset * 0.4, patternOffset, 2.5, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();

    // 3. Static Specular Light Highlight (stays fixed relative to light source)
    const highlightGrad = ctx.createRadialGradient(
      this.x - TABLE.r*0.3, this.y - TABLE.r*0.3, 1,
      this.x, this.y, TABLE.r
    );
    highlightGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
    highlightGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0)');
    highlightGrad.addColorStop(1, 'rgba(0, 0, 0, 0.55)');

    ctx.fillStyle = highlightGrad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, TABLE.r, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

let balls = [];
let cueBall;
let aimAngle = 0;
let gameMode = 'VS_AI';
let aiDifficulty = 'MED';
let currentPlayer = 1;
let playerGroups = { 1: null, 2: null };
let isMoving = false;
let isAiTurn = false;
let gameOver = false;
let pocketedThisTurn = [];
let firstBallHit = null;

// True after a foul: the incoming player must place the cue ball before they can aim & shoot.
let ballInHand = false;

let cueAnimOffset = 0;
let isStriking = false;

// True only for the opening stroke. Balls potted on the break do not assign groups —
// the table stays open until someone pockets a ball on a later shot.
let isBreakShot = true;

function setup8BallRack() {
  relayout();
  balls = [];
  ballInHand = false;
  isAiTurn = false;
  setAiThinkingVisible(false);

  let p = P(200, 0);
  cueBall = new Ball(0, p.x, p.y);
  balls.push(cueBall);

  const startAlong = 630;
  const rackOrder = [1, 9, 2, 10, 8, 3, 11, 4, 12, 5, 13, 6, 14, 7, 15];
  let idx = 0;

  for(let row=0; row<5; row++){
    for(let col=0; col<=row; col++){
      const along = startAlong + row * (TABLE.r * 1.85);
      const across = (col - row/2) * (TABLE.r * 2.15);
      const pt = P(along, across);
      balls.push(new Ball(rackOrder[idx], pt.x, pt.y));
      idx++;
    }
  }

  POCKETS = computePockets();
  currentPlayer = 1;
  playerGroups = { 1: null, 2: null };
  isBreakShot = true;
  gameOver = false;
  updateUI();
  setStatus('BREAK THE RACK!');
}

function resolveCollisions() {
  for(let i=0; i<balls.length; i++){
    for(let j=i+1; j<balls.length; j++){
      const b1 = balls[i], b2 = balls[j];
      if(b1.inPocket || b2.inPocket) continue;

      const dx = b2.x - b1.x, dy = b2.y - b1.y;
      const dist = Math.hypot(dx, dy);

      if(dist < TABLE.r * 2) {
        if(!firstBallHit && b1 === cueBall) firstBallHit = b2;
        if(!firstBallHit && b2 === cueBall) firstBallHit = b1;

        const angle = Math.atan2(dy, dx);
        const sin = Math.sin(angle), cos = Math.cos(angle);

        let vx1 = b1.vx * cos + b1.vy * sin;
        let vy1 = b1.vy * cos - b1.vx * sin;
        let vx2 = b2.vx * cos + b2.vy * sin;
        let vy2 = b2.vy * cos - b2.vx * sin;

        b1.vx = vx2 * cos - vy1 * sin;
        b1.vy = vy1 * cos + vx2 * sin;
        b2.vx = vx1 * cos - vy2 * sin;
        b2.vy = vy2 * cos + vx1 * sin;

        const overlap = (TABLE.r * 2) - dist;
        b1.x -= (overlap/2) * cos; b1.y -= (overlap/2) * sin;
        b2.x += (overlap/2) * cos; b2.y += (overlap/2) * sin;

        AudioEngine.playClack(Math.hypot(b1.vx - b2.vx, b1.vy - b2.vy)/5);
      }
    }
  }
}

function checkPockets() {
  balls.forEach(b => {
    if(b.inPocket) return;
    POCKETS.forEach(p => {
      if(Math.hypot(b.x - p.x, b.y - p.y) < p.r) {
        b.inPocket = true;
        b.vx = 0; b.vy = 0;
        pocketedThisTurn.push(b);
        AudioEngine.playPocket();
      }
    });
  });
}

function checkTurnEnd() {
  const moving = balls.some(b => !b.inPocket && (Math.abs(b.vx) > 0 || Math.abs(b.vy) > 0));
  if(isMoving && !moving && !isStriking) {
    isMoving = false;
    processShotResults();
  }
}

function processShotResults() {
  let switchTurn = true;
  let foulOccurred = false;
  const cuePotted = cueBall.inPocket;
  const wasBreakShot = isBreakShot;
  isBreakShot = false;

  if(cuePotted) {
    foulOccurred = true;
    setStatus('FOUL! Cue ball potted.');
    cueBall.inPocket = false;
    const p = P(200, 0);
    cueBall.x = p.x; cueBall.y = p.y; cueBall.vx = 0; cueBall.vy = 0;
  }

  // Bug fix: the group-cleared test read the table AFTER the shot resolved. Pot your last
  // solid legally and no solids remained, so the required first contact flipped to the
  // 8-ball and your perfectly legal shot was scored as a foul. This reconstructs the
  // pre-shot table by counting balls that went down on this very stroke as still up.
  const pottedThisShot = new Set(pocketedThisTurn);
  const groupWasOnTable = (g) => balls.some(b => b.info.type === g && (!b.inPocket || pottedThisShot.has(b)));

  const myGroup = playerGroups[currentPlayer];
  let wrongBallFoul = false;

  // Bug fix: failing to contact any ball at all was not treated as a foul.
  if(!firstBallHit) {
    wrongBallFoul = true;
    foulOccurred = true;
    setStatus('FOUL! No ball contacted.');
  } else if(myGroup) {
    const expectedType = groupWasOnTable(myGroup) ? myGroup : 'eight';
    if(firstBallHit.info.type !== expectedType) wrongBallFoul = true;
  } else if(!wasBreakShot && firstBallHit.info.type === 'eight') {
    // With the table open you may hit any numbered ball first, but never the 8.
    wrongBallFoul = true;
  }

  if(wrongBallFoul && firstBallHit) {
    foulOccurred = true;
    setStatus('FOUL! Hit the wrong ball first.');
  }

  const eightPotted = pocketedThisTurn.some(b => b.num === 8);
  if(eightPotted) {
    // Potting the 8 while the table is still open, or alongside a scratch, loses the game.
    const openTable = !myGroup;
    const myGroupLeft = !openTable && balls.some(b => !b.inPocket && b.info.type === myGroup);

    gameOver = true;
    if(!openTable && !myGroupLeft && !cuePotted && !wrongBallFoul) {
      setStatus(`GAME OVER! PLAYER ${currentPlayer} WINS!`);
    } else {
      const winner = currentPlayer === 1 ? 2 : 1;
      setStatus(`GAME OVER! PLAYER ${winner} WINS (8-Ball Foul)!`);
    }
    pocketedThisTurn = [];
    updateUI();
    return;
  }

  const validPotted = pocketedThisTurn.filter(b => b.num !== 0 && b.num !== 8);

  if(validPotted.length > 0 && !cuePotted && !wrongBallFoul) {
    // Bug fix: checked playerGroups[1] rather than the shooter's own group.
    if(!playerGroups[currentPlayer]) {
      const types = new Set(validPotted.map(b => b.info.type));
      // Bug fix: any pot used to assign groups immediately, including on the break, and a
      // mixed solid+stripe pot picked a group by array order. Neither assigns now.
      if(wasBreakShot) {
        setStatus('POTTED ON THE BREAK — TABLE STAYS OPEN.');
      } else if(types.size > 1) {
        setStatus('SOLID AND STRIPE POTTED — TABLE STAYS OPEN.');
      } else {
        const firstType = validPotted[0].info.type;
        playerGroups[currentPlayer] = firstType;
        playerGroups[currentPlayer === 1 ? 2 : 1] = firstType === 'solid' ? 'stripe' : 'solid';
        setStatus(`TABLE ASSIGNED: PLAYER ${currentPlayer} IS ${firstType.toUpperCase()}S`);
      }
      switchTurn = false;
    } else {
      const pottedMine = validPotted.some(b => b.info.type === playerGroups[currentPlayer]);
      if(pottedMine) {
        switchTurn = false;
        setStatus('GREAT SHOT! CONTINUE TURN.');
      }
    }
  }

  pocketedThisTurn = [];
  firstBallHit = null;
  if(switchTurn) currentPlayer = currentPlayer === 1 ? 2 : 1;

  // Ball-in-hand: after any foul, the incoming player may place the cue ball anywhere on
  // the table (not restricted, unlike snooker's D).
  if(foulOccurred) {
    if(gameMode === 'VS_AI' && currentPlayer === 2) {
      const rx = TABLE.x + TABLE.r + Math.random() * (TABLE.w - TABLE.r * 2);
      const ry = TABLE.y + TABLE.r + Math.random() * (TABLE.h - TABLE.r * 2);
      const settled = findValidCuePosition(rx, ry);
      cueBall.x = settled.x; cueBall.y = settled.y; cueBall.vx = 0; cueBall.vy = 0;
      ballInHand = false;
    } else {
      ballInHand = true;
      setStatus('FOUL — drag the cue ball anywhere, then aim & fire.');
    }
  }

  updateUI();

  if(gameMode === 'VS_AI' && currentPlayer === 2) {
    setTimeout(triggerAiTurn, 800);
  }
}

function triggerAiTurn() {
  if(isMoving || gameOver) return;
  isAiTurn = true;
  setAiThinkingVisible(true);

  setTimeout(() => {
    const aiGroup = playerGroups[2];
    const targets = balls.filter(b => !b.inPocket && (aiGroup ? b.info.type === aiGroup : b.num !== 0 && b.num !== 8));
    const target = targets[Math.floor(Math.random() * targets.length)]
      || balls.find(b => b.num === 8 && !b.inPocket);
    if(!target) return;

    let angle = Math.atan2(target.y - cueBall.y, target.x - cueBall.x);
    let error = (Math.random() - 0.5) * (aiDifficulty === 'EASY' ? 0.35 : aiDifficulty === 'MED' ? 0.15 : 0.04);

    aimAngle = angle + error;
    fireCue(40 + Math.random() * 40);
    isAiTurn = false;
    setAiThinkingVisible(false);
  }, 1000);
}

function fireCue(powerPercent) {
  if(isMoving || isStriking || gameOver || ballInHand) return;
  isStriking = true;
  
  const power = (powerPercent / 100) * 22;
  const startOffset = 20 + (powerPercent / 100) * 40;
  
  let currentOffset = startOffset;
  const strikeInterval = setInterval(() => {
    currentOffset -= 8;
    cueAnimOffset = currentOffset;
    if(currentOffset <= 12) {
      clearInterval(strikeInterval);
      cueAnimOffset = 0;
      isStriking = false;
      cueBall.vx = Math.cos(aimAngle) * power;
      cueBall.vy = Math.sin(aimAngle) * power;
      isMoving = true;
      firstBallHit = null;
      pocketedThisTurn = [];
      AudioEngine.playClack(power / 10);
    }
  }, 16);
}

// Bug fix: physics used to advance exactly one step per animation frame, so on a 120Hz
// phone every ball travelled twice as fast and friction decayed twice as quickly as on a
// 60Hz screen. A fixed accumulator keeps the table identical on every display.
const PHYSICS_STEP_MS = 1000 / 60;
let lastFrameTime = 0;
let physicsAccumulator = 0;

function stepPhysics() {
  balls.forEach(b => b.update());
  resolveCollisions();
  checkPockets();
}

function render(timestamp) {
  if (typeof timestamp !== 'number') timestamp = performance.now();
  if (!lastFrameTime) lastFrameTime = timestamp;
  // Cap the delta so a backgrounded tab doesn't fast-forward the whole shot on return.
  physicsAccumulator += Math.min(timestamp - lastFrameTime, 100);
  lastFrameTime = timestamp;

  ctx.clearRect(0, 0, Canvas.width, Canvas.height);

  ctx.fillStyle = '#121f3d';
  ctx.fillRect(0, 0, Canvas.width, Canvas.height);
  ctx.fillStyle = '#2b3d6b';
  ctx.fillRect(35, 35, Canvas.width - 70, Canvas.height - 70);

  ctx.fillStyle = '#1a4d8c';
  ctx.fillRect(TABLE.x, TABLE.y, TABLE.w, TABLE.h);

  // Head-string line — drawn perpendicular to whichever axis is currently the long axis,
  // so this stays correct whether the table is landscape (desktop) or portrait (mobile).
  const lineA = P(200, -200), lineB = P(200, 200);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(lineA.x, lineA.y); ctx.lineTo(lineB.x, lineB.y); ctx.stroke();

  POCKETS.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = '#080d1a'; ctx.fill();
    ctx.strokeStyle = '#1e2b4a'; ctx.lineWidth = 3; ctx.stroke();
  });

  if(ballInHand && !cueBall.inPocket) {
    ctx.save();
    ctx.strokeStyle = 'rgba(35, 232, 255, 0.85)';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cueBall.x, cueBall.y, TABLE.r + 8, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  if(!isMoving && !cueBall.inPocket && !ballInHand) {
    const powerVal = parseInt(document.getElementById('powerSlider').value);
    const baseDistance = isStriking ? cueAnimOffset : 15 + (powerVal / 100) * 35;

    ctx.save();
    ctx.strokeStyle = 'rgba(35, 232, 255, 0.6)';
    ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cueBall.x, cueBall.y);
    ctx.lineTo(cueBall.x + Math.cos(aimAngle) * 300, cueBall.y + Math.sin(aimAngle) * 300);
    ctx.stroke(); ctx.restore();

    ctx.save();
    ctx.translate(cueBall.x, cueBall.y); ctx.rotate(aimAngle + Math.PI);
    ctx.fillStyle = '#d4a359'; ctx.fillRect(baseDistance, -3, 220, 6);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(baseDistance, -3, 8, 6);
    ctx.restore();
  }

  let steps = 0;
  while (physicsAccumulator >= PHYSICS_STEP_MS && steps < 8) {
    stepPhysics();
    physicsAccumulator -= PHYSICS_STEP_MS;
    steps++;
  }
  if (physicsAccumulator > PHYSICS_STEP_MS * 8) physicsAccumulator = 0;

  balls.forEach(b => b.draw());
  checkTurnEnd();

  requestAnimationFrame(render);
}

function updateUI() {
  document.getElementById('p1Card').classList.toggle('active', currentPlayer === 1);
  document.getElementById('p2Card').classList.toggle('active', currentPlayer === 2);

  document.getElementById('p1Group').textContent = playerGroups[1] ? playerGroups[1].toUpperCase() + 'S' : 'OPEN TABLE';
  document.getElementById('p2Group').textContent = playerGroups[2] ? playerGroups[2].toUpperCase() + 'S' : 'OPEN TABLE';
}

function setStatus(msg) {
  document.getElementById('statusText').textContent = msg;
}

// Shows/hides the centered "SAVIOR THINKING" overlay on the table. Kept as its own
// call (rather than folded into isAiTurn assignments) so it stays in sync even
// if isAiTurn is ever set from a new code path later.
// The character sticker's src is only assigned here, once per activation (never
// on a timer/interval), so the pulse animation fades it in/out cleanly with no
// mid-fade swap or flicker on mobile or desktop.
function setAiThinkingVisible(visible) {
  if (visible) {
    const avatar = document.getElementById('aiThinkingAvatar');
    if (avatar) avatar.src = SAVIOR_THINKING_STICKERS[Math.floor(Math.random() * SAVIOR_THINKING_STICKERS.length)];
    const taunt = SAVIOR_TAUNTS[Math.floor(Math.random() * SAVIOR_TAUNTS.length)];
    const textEl = document.querySelector('#aiThinkingOverlay .ai-thinking-text');
    if (textEl) textEl.textContent = taunt;
    setStatus(taunt);
  }
  document.getElementById('aiThinkingOverlay').classList.toggle('is-active', visible);
}

function handlePointerAim(e) {
  if(isMoving || isAiTurn || isStriking || gameOver) return;
  const rect = Canvas.getBoundingClientRect();
  const mouseX = (e.clientX - rect.left) * (Canvas.width / rect.width);
  const mouseY = (e.clientY - rect.top) * (Canvas.height / rect.height);
  aimAngle = Math.atan2(mouseY - cueBall.y, mouseX - cueBall.x);
}

// Ball-in-hand: lets the player drag the cue ball anywhere on the table before shooting.
function getCanvasXY(e) {
  const rect = Canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (Canvas.width / rect.width),
    y: (e.clientY - rect.top) * (Canvas.height / rect.height)
  };
}

// Finds a valid cue-ball position near (desiredX, desiredY): inside the table, and not
// overlapping any other ball. Tries the clamped point first, then spirals outward in
// rings, re-clamping each candidate into the table, until a clear spot is found. This is
// guaranteed to terminate correctly even deep inside a tightly packed cluster of balls
// (e.g. dragging straight onto the 8-ball at the center of the rack) — an iterative
// "push away" approach can get stuck oscillating between neighbors there.
function findValidCuePosition(desiredX, desiredY) {
  const minDist = TABLE.r * 2 + 0.5;
  const overlapsAny = (x, y) => balls.some(b => b !== cueBall && !b.inPocket && Math.hypot(x - b.x, y - b.y) < minDist);

  const first = clampPointToTable(desiredX, desiredY);
  if (!overlapsAny(first.x, first.y)) return first;

  const step = TABLE.r;
  const maxRadius = Math.max(TABLE.w, TABLE.h) + step;
  for (let radius = step; radius <= maxRadius; radius += step) {
    const angleSteps = Math.max(8, Math.round((2 * Math.PI * radius) / (TABLE.r * 1.2)));
    for (let i = 0; i < angleSteps; i++) {
      const angle = (i / angleSteps) * Math.PI * 2;
      const candidate = clampPointToTable(desiredX + Math.cos(angle) * radius, desiredY + Math.sin(angle) * radius);
      if (!overlapsAny(candidate.x, candidate.y)) return candidate;
    }
  }
  return first; // shouldn't happen — the table can't realistically be fully packed
}

function handleBallPlacement(e) {
  if(isMoving || isAiTurn || isStriking || gameOver) return;
  const { x, y } = getCanvasXY(e);
  const settled = findValidCuePosition(x, y);
  cueBall.x = settled.x; cueBall.y = settled.y;
  cueBall.vx = 0; cueBall.vy = 0;
}

// Bug fix: on touch devices there's no hover, so the old code fired blind on the very first
// tap (no chance to preview the shot). Touch now works like a slingshot: press+drag to aim,
// lift to fire — mirroring how a mouse hovers to aim then clicks to fire.
let touchAiming = false;

Canvas.addEventListener('pointermove', (e) => {
  if (ballInHand) {
    if (e.pointerType === 'touch' && !touchAiming) return;
    handleBallPlacement(e);
    return;
  }
  if (e.pointerType === 'touch' && !touchAiming) return;
  handlePointerAim(e);
});

Canvas.addEventListener('pointerdown', (e) => {
  if (ballInHand) {
    touchAiming = true;
    handleBallPlacement(e);
    e.preventDefault();
    return;
  }
  if (e.pointerType === 'touch') {
    touchAiming = true;
    handlePointerAim(e);
    e.preventDefault();
    return;
  }
  if (e.button === 0) {
    handlePointerAim(e);
    fireCue(document.getElementById('powerSlider').value);
  }
});

Canvas.addEventListener('pointerup', (e) => {
  if (ballInHand) {
    touchAiming = false;
    handleBallPlacement(e);
    ballInHand = false;
    setStatus('CUE BALL PLACED — AIM & FIRE');
    return;
  }
  if (e.pointerType === 'touch' && touchAiming) {
    touchAiming = false;
    handlePointerAim(e);
    fireCue(document.getElementById('powerSlider').value);
  }
});

Canvas.addEventListener('pointercancel', () => { touchAiming = false; });

Canvas.addEventListener('contextmenu', (e) => e.preventDefault());

document.getElementById('powerSlider').addEventListener('input', (e) => {
  document.getElementById('powerVal').textContent = e.target.value + '%';
});

document.getElementById('shootBtn').addEventListener('click', () => {
  if(isMoving || isAiTurn || isStriking || ballInHand) return;
  fireCue(document.getElementById('powerSlider').value);
});

document.getElementById('btnVsAi').addEventListener('click', () => {
  gameMode = 'VS_AI';
  document.getElementById('p2Name').textContent = `AI (${aiDifficulty})`;
  document.getElementById('btnVsAi').classList.add('active');
  document.getElementById('btn2P').classList.remove('active');
  setup8BallRack();
});

document.getElementById('btn2P').addEventListener('click', () => {
  gameMode = '2P';
  document.getElementById('p2Name').textContent = 'PLAYER 2';
  document.getElementById('btn2P').classList.add('active');
  document.getElementById('btnVsAi').classList.remove('active');
  setup8BallRack();
});

document.getElementById('btnDiff').addEventListener('click', () => {
  if(aiDifficulty === 'EASY') aiDifficulty = 'MED';
  else if(aiDifficulty === 'MED') aiDifficulty = 'HARD';
  else aiDifficulty = 'EASY';

  document.getElementById('btnDiff').textContent = `DIFF: ${aiDifficulty}`;
  if(gameMode === 'VS_AI') document.getElementById('p2Name').textContent = `AI (${aiDifficulty})`;
});

document.getElementById('btnReset').addEventListener('click', setup8BallRack);

document.getElementById('soundBtn').addEventListener('click', () => {
  const on = AudioEngine.toggleSound();
  document.getElementById('soundBtn').classList.toggle('is-on', on);
  document.getElementById('soundBtn').textContent = on ? '🔊 LOFI SOUND' : '🔇 MUTED';
});

document.addEventListener('pointerdown', () => AudioEngine.ensureStarted(), { once: true });

let resizeTimer = null;
function handleViewportChange(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(relayout, 120);
}
mqPortrait.addEventListener('change', handleViewportChange);
window.addEventListener('resize', handleViewportChange);
window.addEventListener('orientationchange', handleViewportChange);

setup8BallRack();
render();
introShowStep(0);
</script>
</body>
</html>
