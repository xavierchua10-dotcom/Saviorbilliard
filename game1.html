<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0014">
<title>Snooker — Savior Cue Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #05010f;
    --deep: #0d0122;
    --panel: rgba(16, 4, 38, 0.92);
    --pink: #ff2fd8;
    --purple: #8b2fff;
    --cyan: #23e8ff;
    --lavender: #b9a3e8;
    --text-main: #f2ecff;
    --text-muted: #a996d1;
    --felt-a: #0f5a3f;
    --felt-b: #073b28;
    --cushion: #2a140b;
    --cushion-rim: #5c2f18;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; min-height: 100vh; background: var(--void); color: var(--text-main);
    font-family: 'Rajdhani', sans-serif; display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden; padding-bottom: 2rem;
  }

  .nav-bar {
    width: 100%; max-width: 1100px; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; z-index: 10;
  }
  .back-btn {
    font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 700; color: var(--cyan);
    text-decoration: none; padding: 0.5rem 1rem; border: 1px solid var(--cyan); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    background: rgba(35, 232, 255, 0.1); transition: all 0.2s; display: flex; align-items: center; gap: 0.4rem;
  }
  .back-btn:hover { background: var(--cyan); color: var(--void); box-shadow: 0 0 15px var(--cyan); }

  .game-title {
    font-family: 'Press Start 2P', monospace; font-size: clamp(0.9rem, 2.5vw, 1.4rem); color: var(--text-main);
    text-shadow: 0 0 10px var(--pink), 0 0 20px var(--purple); margin: 0;
  }

  .sound-btn {
    background: rgba(255, 47, 216, 0.1); border: 1px solid var(--pink); color: var(--pink);
    padding: 0.5rem 0.8rem; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); transition: all 0.2s;
  }
  .sound-btn.is-on { background: rgba(35, 232, 255, 0.2); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }

  .dash {
    width: 95%; max-width: 1000px; background: var(--panel); border: 1px solid rgba(139, 47, 255, 0.4);
    border-radius: 8px; padding: 0.8rem 1.2rem; margin-bottom: 1rem; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;
    box-shadow: 0 0 20px rgba(139, 47, 255, 0.2);
  }
  .score-box { display: flex; align-items: center; gap: 1.5rem; font-family: 'Orbitron', sans-serif; }
  .player-card { display: flex; flex-direction: column; align-items: flex-start; }
  .player-card.active { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  .player-name { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }
  .player-card.active .player-name { color: var(--cyan); }
  .player-pts { font-size: 1.4rem; font-weight: 800; }
  .vs-badge { font-size: 0.8rem; color: var(--pink); font-weight: 700; }

  .status-text {
    font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: var(--pink); font-weight: 600; letter-spacing: 0.05em; text-align: center;
  }

  .mode-controls { display: flex; align-items: center; gap: 0.6rem; }
  .btn-opt {
    font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 700; padding: 0.4rem 0.8rem;
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--purple); color: var(--text-muted); cursor: pointer;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); transition: all 0.2s;
  }
  .btn-opt.active { background: var(--purple); color: #fff; border-color: var(--pink); box-shadow: 0 0 10px var(--pink); }

  .table-wrapper {
    position: relative; width: 95%; max-width: 1000px; aspect-ratio: 2 / 1; background: #000; border-radius: 12px;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), 0 0 1px 2px var(--cushion-rim); overflow: hidden; touch-action: none;
  }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }

  @media (max-width: 700px) and (orientation: portrait) {
    .table-wrapper { width: min(88vw, 36vh); max-width: none; aspect-ratio: 1 / 2; }
  }

  /* AI Thinking overlay: centered over the table, hidden on the player's turn,
     pulsing while the AI is "thinking". Uses visibility (not just opacity) so it
     never intercepts pointer events even before the fade-out finishes. */
  .ai-thinking-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease; z-index: 5;
  }
  .ai-thinking-overlay.is-active { opacity: 1; visibility: visible; animation: aiThinkPulse 1.1s ease-in-out infinite; }
  .ai-thinking-overlay .ai-thinking-text {
    font-family: 'Orbitron', sans-serif; font-weight: 800; letter-spacing: 0.12em; text-align: center; white-space: nowrap;
    font-size: clamp(0.8rem, 3.4vw, 1.5rem); color: var(--pink); text-shadow: 0 0 12px var(--pink), 0 0 22px var(--purple);
    background: rgba(5, 1, 15, 0.6); border: 1px solid var(--pink); border-radius: 8px; padding: 0.55em 1.1em;
  }
  @keyframes aiThinkPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .controls-bar {
    width: 95%; max-width: 1000px; margin-top: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    background: var(--panel); border: 1px solid rgba(35, 232, 255, 0.3); padding: 0.8rem 1.2rem; border-radius: 8px;
  }
  .power-wrap { flex: 1; display: flex; flex-direction: column; gap: 0.3rem; }
  .power-label { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.1em; }
  .power-slider {
    width: 100%; -webkit-appearance: none; appearance: none; height: 10px; background: #1a0f30; border-radius: 5px; outline: none; border: 1px solid var(--purple);
  }
  .power-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--cyan); cursor: pointer; box-shadow: 0 0 10px var(--cyan);
  }
  .shoot-btn {
    font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 800; padding: 0.7rem 1.8rem; color: #0a0014;
    background: linear-gradient(90deg, var(--pink), var(--cyan)); border: none; cursor: pointer;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    box-shadow: 0 0 15px var(--pink); transition: transform 0.1s, box-shadow 0.2s;
  }
  .shoot-btn:active { transform: scale(0.96); }

  .target-indicator {
    display: flex; align-items: center; gap: 0.5rem; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: var(--text-main);
  }
  .ball-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,0.4); }

  @media (max-width: 700px) {
    .dash { flex-direction: column; align-items: stretch; gap: 0.6rem; }
    .score-box { justify-content: space-between; }
    .mode-controls { justify-content: center; flex-wrap: wrap; }
    .controls-bar { flex-wrap: wrap; }
    .shoot-btn { flex: 1; min-width: 120px; }
  }
</style>
</head>
<body>

  <div class="nav-bar">
    <a href="index.html" class="back-btn">◀ HALL MENU</a>
    <h1 class="game-title">SNOOKER</h1>
    <button id="soundBtn" class="sound-btn is-on">🔊 LOFI SOUND</button>
  </div>

  <div class="dash">
    <div class="score-box">
      <div id="p1Card" class="player-card active">
        <span class="player-name" id="p1Name">PLAYER 1</span>

    <div class="target-indicator">

  <div class="table-wrapper">
    <canvas id="gameCanvas" width="1000" height="500"></canvas>
    <div id="aiThinkingOverlay" class="ai-thinking-overlay" aria-hidden="true">
      <span class="ai-thinking-text">AI THINKING…</span>
    </div>
  </div>

  <div class="controls-bar">
    <div class="power-wrap">
      <div style="display:flex; justify-content:space-between;">
        <span class="power-label">SHOT POWER</span>

      <input type="range" id="powerSlider" class="power-slider" min="10" max="100" value="50">
    </div>
    <button id="shootBtn" class="shoot-btn">STRIKE</button>
  </div>

<script>
const AudioEngine = (function(){
  let ctx, master, isMuted = false;
  function init(){
    if(ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.2;
      master.connect(ctx.destination);
    }
  }

  function playClack(intensity = 1.0){
    if(!ctx || isMuted) return;
    if(ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1400 + Math.random()*200, now);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
    
    g.gain.setValueAtTime(0.6 * Math.min(intensity, 1), now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
    
    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + 0.05);

    const noiseLen = Math.floor(ctx.sampleRate * 0.02);
    const buf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0; i<noiseLen; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i/(noiseLen*0.2));
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 2500;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.3 * Math.min(intensity, 1), now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
    src.connect(filter);
    filter.connect(ng);
    ng.connect(master);
    src.start(now);
  }

  function playPocket(){
    if(!ctx || isMuted) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
    g.gain.setValueAtTime(0.8, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + 0.2);
  }

  let musicInterval = null;
  const CHORDS = [
    [261.63, 329.63, 392.00, 493.88],
    [220.00, 261.63, 329.63, 392.00],
    [174.61, 220.00, 261.63, 329.63],
    [196.00, 246.94, 293.66, 349.23]
  ];
  let chordIdx = 0;

  function startLofi(){
    if(musicInterval) return;
    init();
    musicInterval = setInterval(() => {
      if(!ctx || isMuted) return;
      const now = ctx.currentTime;
      const chord = CHORDS[chordIdx % CHORDS.length];
      chordIdx++;

      chord.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(0.045, now + 0.2);
        g.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
        osc.connect(g);
        g.connect(master);
        osc.start(now + i*0.05);
        osc.stop(now + 2.3);
      });
    }, 2800);
  }

  function toggleSound(){
    init();
    isMuted = !isMuted;
    if(!isMuted) startLofi();
    return !isMuted;
  }

  // Bug fix: the button defaulted to showing "ON", but browsers block audio until a real
  // user gesture, so nothing ever actually played — and the FIRST click on the button then
  // silently muted audio that was never audible. This starts real playback on the first
  // genuine interaction so the UI's default "ON" state is actually true.
  function ensureStarted(){
    init();
    // Some browsers (notably Safari/iOS) still create the AudioContext in a
    // 'suspended' state even when init() runs inside a genuine user gesture —
    // resume() here guarantees playback actually starts on that first tap.
    if(ctx && ctx.state === 'suspended') ctx.resume();
    if(!isMuted) startLofi();
  }

  return { init, playClack, playPocket, startLofi, toggleSound, ensureStarted };
})();

const Canvas = document.getElementById('gameCanvas');
const ctx = Canvas.getContext('2d');

// TABLE is mutable: dimensions get recomputed on layout changes (mobile portrait <-> desktop landscape).
// The long axis is always 900 "table units" and the short axis 400, regardless of which physical
// screen axis (x or y) they map to — this keeps every ball/pocket/line position valid across orientations.
const TABLE = { x: 50, y: 50, w: 900, h: 400, r: 10, friction: 0.986 };

const SNOOKER_COLORS = {
  white: { color: '#ffffff', val: 0, name: 'CUE BALL' },
  red: { color: '#e62222', val: 1, name: 'RED (1pt)' },
  yellow: { color: '#ffea00', val: 2, name: 'YELLOW (2pt)' },
  green: { color: '#00cc44', val: 3, name: 'GREEN (3pt)' },
  brown: { color: '#99592a', val: 4, name: 'BROWN (4pt)' },
  blue: { color: '#2b65ec', val: 5, name: 'BLUE (5pt)' },
  pink: { color: '#ff66cc', val: 6, name: 'PINK (6pt)' },
  black: { color: '#222222', val: 7, name: 'BLACK (7pt)' }
};

let POCKETS = [];

// longIsX: true when the table's long dimension (900 units) currently runs horizontally (desktop/landscape).
// false when it runs vertically (mobile portrait) — i.e. the table is rotated 90°.
function longIsX() { return TABLE.w >= TABLE.h; }

// Converts abstract table coordinates (along the cue-to-triangle axis, across the centerline)
// into real canvas x/y for whichever orientation is currently active.
function P(along, across) {
  if (longIsX()) return { x: TABLE.x + along, y: TABLE.y + TABLE.h / 2 + across };
  return { x: TABLE.x + TABLE.w / 2 + across, y: TABLE.y + along };
}

// Inverse of P() — used to preserve ball positions when the orientation changes mid-game.
function unP(x, y) {
  if (longIsX()) return { along: x - TABLE.x, across: y - (TABLE.y + TABLE.h / 2) };
  return { along: y - TABLE.y, across: x - (TABLE.x + TABLE.w / 2) };
}

// Clamps an along/across table-space point to inside the "D" — the semicircle (radius 60,
// centered on the baulk line at along=180) that the cue ball must be placed within on the
// first shot of a frame, and after any foul. Used for ball-in-hand placement.
const D_CENTER_ALONG = 180, D_RADIUS = 60;
function clampToD(along, across) {
  let a = Math.min(along, D_CENTER_ALONG);
  let c = across;
  const da = a - D_CENTER_ALONG, dc = c;
  const dist = Math.hypot(da, dc);
  if (dist > D_RADIUS) {
    const scale = D_RADIUS / dist;
    a = D_CENTER_ALONG + da * scale;
    c = dc * scale;
  }
  return { along: a, across: c };
}

function computePockets() {
  const cx = TABLE.x + TABLE.w / 2, cy = TABLE.y + TABLE.h / 2;
  if (longIsX()) {
    return [
      { x: TABLE.x, y: TABLE.y, r: 20 },
      { x: cx, y: TABLE.y - 4, r: 18 },
      { x: TABLE.x + TABLE.w, y: TABLE.y, r: 20 },
      { x: TABLE.x, y: TABLE.y + TABLE.h, r: 20 },
      { x: cx, y: TABLE.y + TABLE.h + 4, r: 18 },
      { x: TABLE.x + TABLE.w, y: TABLE.y + TABLE.h, r: 20 }
    ];
  }
  return [
    { x: TABLE.x, y: TABLE.y, r: 20 },
    { x: TABLE.x - 4, y: cy, r: 18 },
    { x: TABLE.x, y: TABLE.y + TABLE.h, r: 20 },
    { x: TABLE.x + TABLE.w, y: TABLE.y, r: 20 },
    { x: TABLE.x + TABLE.w + 4, y: cy, r: 18 },
    { x: TABLE.x + TABLE.w, y: TABLE.y + TABLE.h, r: 20 }
  ];
}

const mqPortrait = window.matchMedia('(max-width: 700px) and (orientation: portrait)');

function relayout() {
  const wasLongIsX = longIsX();
  // Snapshot existing ball positions in table-space before we change geometry.
  const snapshot = balls.map(b => ({ ball: b, ...unP(b.x, b.y) }));

  const portrait = mqPortrait.matches;
  const W = portrait ? 500 : 1000;
  const H = portrait ? 1000 : 500;
  Canvas.width = W;
  Canvas.height = H;
  TABLE.x = 50; TABLE.y = 50; TABLE.w = W - 100; TABLE.h = H - 100;

  POCKETS = computePockets();

  if (balls.length) {
    snapshot.forEach(s => {
      const p = P(s.along, s.across);
      s.ball.x = p.x; s.ball.y = p.y;
    });
  }
}

class Ball {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.type = type;
    this.info = SNOOKER_COLORS[type];
    this.inPocket = false;
    this.rotationAngle = Math.random() * Math.PI * 2;
    this.rollDir = 0;
  }

  update() {
    if(this.inPocket) return;
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= TABLE.friction;
    this.vy *= TABLE.friction;

    const speed = Math.hypot(this.vx, this.vy);
    if(speed > 0.05) {
      this.rotationAngle += speed / TABLE.r;
      this.rollDir = Math.atan2(this.vy, this.vx);
    } else {
      this.vx = 0; this.vy = 0;
    }

    const minX = TABLE.x + TABLE.r;
    const maxX = TABLE.x + TABLE.w - TABLE.r;
    const minY = TABLE.y + TABLE.r;
    const maxY = TABLE.y + TABLE.h - TABLE.r;

    if(this.x < minX) { this.x = minX; this.vx *= -0.85; AudioEngine.playClack(Math.abs(this.vx)); }
    if(this.x > maxX) { this.x = maxX; this.vx *= -0.85; AudioEngine.playClack(Math.abs(this.vx)); }
    if(this.y < minY) { this.y = minY; this.vy *= -0.85; AudioEngine.playClack(Math.abs(this.vy)); }
    if(this.y > maxY) { this.y = maxY; this.vy *= -0.85; AudioEngine.playClack(Math.abs(this.vy)); }
  }

  draw() {
    if(this.inPocket) return;
    ctx.save();

    // 1. Shadow underneath
    ctx.beginPath();
    ctx.arc(this.x + 3, this.y + 3, TABLE.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();

    // Clip to sphere
    ctx.beginPath();
    ctx.arc(this.x, this.y, TABLE.r, 0, Math.PI*2);
    ctx.clip();

    // Solid ball base color
    ctx.fillStyle = this.info.color;
    ctx.fill();

    // 2. Rotating Surface Features (Aramith Brand Stencil & Spin Seams)
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rollDir);

    const patternOffset = Math.sin(this.rotationAngle) * (TABLE.r * 0.65);
    const patternScale = Math.cos(this.rotationAngle);

    if(patternScale > -0.2) {
      ctx.save();
      ctx.translate(0, patternOffset);
      ctx.scale(1, Math.abs(patternScale));
      
      // Fine surface shine/brand dot so solid snooker balls visually spin
      ctx.fillStyle = this.type === 'white' ? '#23e8ff' : 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.arc(0, 0, 2, 0, Math.PI*2);
      ctx.fill();

      // Curved seam shadow for 3D sphere rotation
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, TABLE.r * 0.7, 0, Math.PI);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // 3. Static Specular Light Highlight (Overhead lighting stays fixed)
    const highlightGrad = ctx.createRadialGradient(
      this.x - TABLE.r*0.3, this.y - TABLE.r*0.3, 1,
      this.x, this.y, TABLE.r
    );
    highlightGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
    highlightGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0)');
    highlightGrad.addColorStop(1, 'rgba(0, 0, 0, 0.55)');

    ctx.fillStyle = highlightGrad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, TABLE.r, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

let balls = [];
let cueBall;
let aimAngle = 0;
let gameMode = 'VS_AI';
let aiDifficulty = 'MED';
let currentPlayer = 1;
let scores = { 1: 0, 2: 0 };
let currentTargetSequence = 'RED';
let pocketedThisTurn = [];
let firstBallHit = null;
let isMoving = false;
let isAiTurn = false;
let gameOver = false;

// True at the start of every frame and after any foul: the current player must place the
// cue ball inside the D before they can aim & shoot.
let ballInHand = false;

let cueAnimOffset = 0;
let isStriking = false;

// Each colour has its own spot. Previously every potted colour was returned to the blue
// spot, which is wrong and could also drop a ball on top of another one.
const COLOR_SPOTS = {
  yellow: [180,  60],
  green:  [180, -60],
  brown:  [180,   0],
  blue:   [450,   0],
  pink:   [660,   0],
  black:  [810,   0]
};
const LONG_AXIS = 900;
const COLOR_ORDER = ['yellow', 'green', 'brown', 'blue', 'pink', 'black'];

function redsLeft() {
  return balls.some(b => b.type === 'red' && !b.inPocket);
}

// Lowest-value colour still on the table — this is what a player must take, in order,
// once every red is gone.
function lowestColorLeft() {
  return COLOR_ORDER.find(t => balls.some(b => b.type === t && !b.inPocket)) || null;
}

// currentTargetSequence is 'RED', 'COLOR' (any colour, while reds remain), or a specific
// colour name during the endgame clearance.
function isLegalTarget(ball) {
  if (!ball || ball.type === 'white') return false;
  if (currentTargetSequence === 'RED') return ball.type === 'red';
  if (currentTargetSequence === 'COLOR') return ball.type !== 'red';
  return ball.type === currentTargetSequence;
}

// Returns a potted colour to its own spot; if that spot is occupied, falls back to the
// highest free spot, then to the nearest clear point along the long axis.
function respotColor(ball) {
  ball.inPocket = false;
  ball.vx = 0; ball.vy = 0;
  const free = (x, y) => !balls.some(o => o !== ball && !o.inPocket && Math.hypot(x - o.x, y - o.y) < TABLE.r * 2);
  const [along, across] = COLOR_SPOTS[ball.type] || [450, 0];

  const home = P(along, across);
  if (free(home.x, home.y)) { ball.x = home.x; ball.y = home.y; return; }

  for (let i = COLOR_ORDER.length - 1; i >= 0; i--) {
    const [a, c] = COLOR_SPOTS[COLOR_ORDER[i]];
    const q = P(a, c);
    if (free(q.x, q.y)) { ball.x = q.x; ball.y = q.y; return; }
  }

  for (let d = TABLE.r * 2; d < LONG_AXIS; d += TABLE.r) {
    for (const dir of [1, -1]) {
      const a = along + d * dir;
      if (a < TABLE.r || a > LONG_AXIS - TABLE.r) continue;
      const q = P(a, across);
      if (free(q.x, q.y)) { ball.x = q.x; ball.y = q.y; return; }
    }
  }
  ball.x = home.x; ball.y = home.y;
}

function setupSnookerRack() {
  relayout();
  balls = [];
  isAiTurn = false;
  setAiThinkingVisible(false);

  // Bug fix: original code placed the cue ball and the brown ball at identical coordinates
  // (both at along=180, across=0), causing a zero-distance collision on the very first frame.
  // The cue ball now starts right on the D's arc (its farthest point from the baulk line).
  let p = P(D_CENTER_ALONG - D_RADIUS, 0);
  cueBall = new Ball(p.x, p.y, 'white');
  balls.push(cueBall);

  p = P(180, 60); balls.push(new Ball(p.x, p.y, 'yellow'));
  p = P(180, 0); balls.push(new Ball(p.x, p.y, 'brown'));
  p = P(180, -60); balls.push(new Ball(p.x, p.y, 'green'));
  // Bug fix: this used TABLE.w/2, but TABLE.w is the *short* axis in mobile portrait mode
  // (only 400 units there, not the 900-unit long/"along" axis) — so on mobile the blue ball
  // landed at along=200, almost on top of brown (along=180). The blue spot is always the
  // midpoint of the fixed 900-unit long axis, so it must use a constant, not TABLE.w.
  p = P(450, 0); balls.push(new Ball(p.x, p.y, 'blue'));
  p = P(660, 0); balls.push(new Ball(p.x, p.y, 'pink'));
  p = P(810, 0); balls.push(new Ball(p.x, p.y, 'black'));

  // Bug fix: the apex red sat at along=675 while pink sits at along=660 — only 15 units
  // apart with a 20-unit ball diameter, so the rack was already overlapping at setup and
  // detonated on the first physics frame. The apex red now clears pink properly.
  const startAlong = 692;
  for(let row=0; row<5; row++){
    for(let col=0; col<=row; col++){
      const along = startAlong + row * (TABLE.r * 1.8);
      const across = (col - row/2) * (TABLE.r * 2.1);
      const pt = P(along, across);
      balls.push(new Ball(pt.x, pt.y, 'red'));
    }
  }

  POCKETS = computePockets();
  scores = { 1: 0, 2: 0 };
  currentPlayer = 1;
  currentTargetSequence = 'RED';
  gameOver = false;
  ballInHand = true;
  updateScoreUI();
  setStatus('PLACE THE CUE BALL IN THE D, THEN AIM & FIRE');
}

function resolveCollisions() {
  for(let i=0; i<balls.length; i++){
    for(let j=i+1; j<balls.length; j++){
      const b1 = balls[i];
      const b2 = balls[j];
      if(b1.inPocket || b2.inPocket) continue;

      const dx = b2.x - b1.x;
      const dy = b2.y - b1.y;
      const dist = Math.hypot(dx, dy);

      if(dist < TABLE.r * 2) {
        if(!firstBallHit && b1 === cueBall) firstBallHit = b2;
        if(!firstBallHit && b2 === cueBall) firstBallHit = b1;

        const angle = Math.atan2(dy, dx);
        const sin = Math.sin(angle), cos = Math.cos(angle);

        let vx1 = b1.vx * cos + b1.vy * sin;
        let vy1 = b1.vy * cos - b1.vx * sin;
        let vx2 = b2.vx * cos + b2.vy * sin;
        let vy2 = b2.vy * cos - b2.vx * sin;

        const finalVx1 = vx2;
        const finalVx2 = vx1;

        b1.vx = finalVx1 * cos - vy1 * sin;
        b1.vy = vy1 * cos + finalVx1 * sin;
        b2.vx = finalVx2 * cos - vy2 * sin;
        b2.vy = vy2 * cos + finalVx2 * sin;

        const overlap = (TABLE.r * 2) - dist;
        b1.x -= (overlap/2) * cos;
        b1.y -= (overlap/2) * sin;
        b2.x += (overlap/2) * cos;
        b2.y += (overlap/2) * sin;

        const speed = Math.hypot(b1.vx - b2.vx, b1.vy - b2.vy);
        AudioEngine.playClack(speed / 5);
      }
    }
  }
}

function checkPockets() {
  balls.forEach(b => {
    if(b.inPocket) return;
    POCKETS.forEach(p => {
      if(Math.hypot(b.x - p.x, b.y - p.y) < p.r) {
        b.inPocket = true;
        b.vx = 0; b.vy = 0;
        pocketedThisTurn.push(b);
        AudioEngine.playPocket();
      }
    });
  });
}

function checkTurnEnd() {
  const moving = balls.some(b => !b.inPocket && (Math.abs(b.vx) > 0 || Math.abs(b.vy) > 0));
  if(isMoving && !moving && !isStriking) {
    isMoving = false;
    processShotResults();
  }
}

function processShotResults() {
  let switchTurn = true;
  let pointsAwarded = 0;
  let foulOccurred = false;
  let foulValue = 4;
  let foulReason = '';

  const cuePotted = cueBall.inPocket;
  const potted = pocketedThisTurn.filter(b => b !== cueBall);

  // ---- foul detection -------------------------------------------------------------
  if (cuePotted) {
    foulOccurred = true;
    foulReason = 'Cue ball potted';
  }
  // Bug fix: failing to contact any ball at all was silently treated as a clean miss.
  if (!firstBallHit) {
    foulOccurred = true;
    foulReason = foulReason || 'No ball contacted';
  } else if (!isLegalTarget(firstBallHit)) {
    foulOccurred = true;
    foulValue = Math.max(foulValue, firstBallHit.info.val);
    foulReason = foulReason || 'Wrong ball hit first';
  }
  // Bug fix: potting an off-target ball alongside a legal one used to be scored by array
  // order. Every potted ball is now checked, and the foul is worth the highest ball involved.
  potted.forEach(b => {
    if (!isLegalTarget(b)) {
      foulOccurred = true;
      foulValue = Math.max(foulValue, b.info.val);
      foulReason = foulReason || 'Wrong ball potted';
    }
  });

  if (foulOccurred) {
    scores[currentPlayer === 1 ? 2 : 1] += foulValue;
    setStatus(`FOUL! ${foulReason}. +${foulValue} to opponent.`);
    // Bug fix: colours potted on a foul used to stay off the table permanently, so the
    // black could vanish from the frame. Reds legitimately stay down; colours come back.
    potted.forEach(b => { if (b.type !== 'red') respotColor(b); });
    if (cuePotted) { cueBall.inPocket = false; cueBall.vx = 0; cueBall.vy = 0; }
    currentTargetSequence = redsLeft() ? 'RED' : (lowestColorLeft() || 'RED');

  } else if (potted.length > 0) {
    // Bug fix: only the first potted ball used to score, so two reds in one shot paid 1pt.
    potted.forEach(b => { pointsAwarded += b.info.val; });
    switchTurn = false;
    setStatus(`POTTED ${potted.map(b => b.info.name).join(' + ')} — +${pointsAwarded} pts.`);

    if (redsLeft()) {
      potted.forEach(b => { if (b.type !== 'red') respotColor(b); });
      currentTargetSequence = currentTargetSequence === 'RED' ? 'COLOR' : 'RED';
    } else {
      // Endgame: colours stay down and must be taken yellow -> black in order.
      currentTargetSequence = lowestColorLeft() || 'RED';
    }

  } else {
    // Bug fix: a clean miss left currentTargetSequence untouched, so a player who potted a
    // red and then missed the colour handed their opponent a free colour instead of a red.
    setStatus('MISS — turn passes.');
    currentTargetSequence = redsLeft() ? 'RED' : (lowestColorLeft() || 'RED');
  }

  scores[currentPlayer] += pointsAwarded;
  pocketedThisTurn = [];
  firstBallHit = null;

  if (switchTurn) {
    currentPlayer = currentPlayer === 1 ? 2 : 1;
  }

  // Ball-in-hand: after any foul, the incoming player plays from inside the D (standard
  // snooker rule — unlike some pool variants, this is never "anywhere on the table").
  if (foulOccurred) {
    { const p = P(D_CENTER_ALONG - D_RADIUS, 0); cueBall.x = p.x; cueBall.y = p.y; cueBall.vx = 0; cueBall.vy = 0; }
    if (gameMode === 'VS_AI' && currentPlayer === 2) {
      const along = D_CENTER_ALONG - Math.random() * D_RADIUS;
      const across = (Math.random() - 0.5) * D_RADIUS;
      const placed = clampToD(along, across);
      const initial = P(placed.along, placed.across);
      const settled = findValidCuePosition(initial.x, initial.y);
      cueBall.x = settled.x; cueBall.y = settled.y;
      ballInHand = false;
    } else {
      ballInHand = true;
      setStatus('FOUL — drag the cue ball inside the D, then aim & fire.');
    }
  }

  updateScoreUI();

  const ballsRemaining = balls.some(b => b.type !== 'white' && !b.inPocket);
  if (!ballsRemaining) {
    gameOver = true;
    const winner = scores[1] === scores[2] ? null : (scores[1] > scores[2] ? 1 : 2);
    setStatus(winner ? `FRAME OVER! PLAYER ${winner} WINS ${scores[winner]}-${scores[winner === 1 ? 2 : 1]}!` : `FRAME OVER! IT'S A DRAW!`);
    return;
  }

  if (gameMode === 'VS_AI' && currentPlayer === 2) {
    setTimeout(triggerAiTurn, 800);
  }
}

function triggerAiTurn() {
  if(isMoving || gameOver) return;
  isAiTurn = true;
  setStatus('AI THINKING...');
  setAiThinkingVisible(true);

  setTimeout(() => {
    // Bug fix: the AI aimed at 'yellow' as a stand-in for "any colour", so it ignored the
    // endgame ordering entirely. It now picks from whatever is actually legal to hit.
    const targets = balls.filter(b => !b.inPocket && isLegalTarget(b));
    let bestTarget = targets[Math.floor(Math.random() * targets.length)]
      || balls.find(b => b !== cueBall && !b.inPocket);
    if (!bestTarget) return;
    let angle = Math.atan2(bestTarget.y - cueBall.y, bestTarget.x - cueBall.x);

    let error = 0;
    if(aiDifficulty === 'EASY') error = (Math.random() - 0.5) * 0.35;
    if(aiDifficulty === 'MED') error = (Math.random() - 0.5) * 0.15;
    if(aiDifficulty === 'HARD') error = (Math.random() - 0.5) * 0.04;

    aimAngle = angle + error;
    const power = 40 + Math.random() * 40;

    fireCue(power);
    isAiTurn = false;
    setAiThinkingVisible(false);
  }, 1000);
}

function fireCue(powerPercent) {
  // Bug fix: this was missing the ballInHand guard its 8-ball counterpart has, so the cue
  // could be struck before it had been placed.
  if(isMoving || isStriking || gameOver || ballInHand) return;
  isStriking = true;

  const power = (powerPercent / 100) * 22;
  const startOffset = 20 + (powerPercent / 100) * 40;

  let currentOffset = startOffset;
  const strikeInterval = setInterval(() => {
    currentOffset -= 8;
    cueAnimOffset = currentOffset;
    if(currentOffset <= 10) {
      clearInterval(strikeInterval);
      cueAnimOffset = 0;
      isStriking = false;
      cueBall.vx = Math.cos(aimAngle) * power;
      cueBall.vy = Math.sin(aimAngle) * power;
      isMoving = true;
      firstBallHit = null;
      pocketedThisTurn = [];
      AudioEngine.playClack(power / 10);
    }
  }, 16);
}

// Bug fix: physics used to advance exactly one step per animation frame, so on a 120Hz
// phone every ball travelled twice as fast and friction decayed twice as quickly as on a
// 60Hz screen. A fixed accumulator keeps the table identical on every display.
const PHYSICS_STEP_MS = 1000 / 60;
let lastFrameTime = 0;
let physicsAccumulator = 0;

function stepPhysics() {
  balls.forEach(b => b.update());
  resolveCollisions();
  checkPockets();
}

function render(timestamp) {
  if (typeof timestamp !== 'number') timestamp = performance.now();
  if (!lastFrameTime) lastFrameTime = timestamp;
  // Cap the delta so a backgrounded tab doesn't fast-forward the whole shot on return.
  physicsAccumulator += Math.min(timestamp - lastFrameTime, 100);
  lastFrameTime = timestamp;

  ctx.clearRect(0, 0, Canvas.width, Canvas.height);

  ctx.fillStyle = '#2a140b';
  ctx.fillRect(0, 0, Canvas.width, Canvas.height);
  ctx.fillStyle = '#5c2f18';
  ctx.fillRect(35, 35, Canvas.width - 70, Canvas.height - 70);

  ctx.fillStyle = '#0f5a3f';
  ctx.fillRect(TABLE.x, TABLE.y, TABLE.w, TABLE.h);

  // Baulk line + "D" — drawn perpendicular to whichever axis is currently the long axis,
  // so this stays correct whether the table is landscape (desktop) or portrait (mobile).
  const baulkA = P(180, -200), baulkB = P(180, 200);
  const dCenter = P(180, 0);
  const arcStart = longIsX() ? Math.PI / 2 : Math.PI;
  const arcEnd = longIsX() ? Math.PI * 1.5 : Math.PI * 2;

  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(baulkA.x, baulkA.y);
  ctx.lineTo(baulkB.x, baulkB.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(dCenter.x, dCenter.y, 60, arcStart, arcEnd);
  ctx.stroke();

  if(ballInHand) {
    ctx.save();
    ctx.fillStyle = 'rgba(35, 232, 255, 0.18)';
    ctx.beginPath();
    ctx.arc(dCenter.x, dCenter.y, 60, arcStart, arcEnd);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  POCKETS.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = '#0a0a0a';
    ctx.fill();
    ctx.strokeStyle = '#3a2010';
    ctx.lineWidth = 3;
    ctx.stroke();
  });

  if(!isMoving && !cueBall.inPocket && !ballInHand) {
    const powerVal = parseInt(document.getElementById('powerSlider').value);
    const baseDistance = isStriking ? cueAnimOffset : 15 + (powerVal / 100) * 35;

    ctx.save();
    ctx.strokeStyle = 'rgba(35, 232, 255, 0.6)';
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cueBall.x, cueBall.y);
    ctx.lineTo(cueBall.x + Math.cos(aimAngle) * 300, cueBall.y + Math.sin(aimAngle) * 300);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(cueBall.x, cueBall.y);
    ctx.rotate(aimAngle + Math.PI);
    ctx.fillStyle = '#d4a359';
    ctx.fillRect(baseDistance, -3, 220, 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(baseDistance, -3, 8, 6);
    ctx.restore();
  }

  let steps = 0;
  while (physicsAccumulator >= PHYSICS_STEP_MS && steps < 8) {
    stepPhysics();
    physicsAccumulator -= PHYSICS_STEP_MS;
    steps++;
  }
  if (physicsAccumulator > PHYSICS_STEP_MS * 8) physicsAccumulator = 0;

  balls.forEach(b => b.draw());
  checkTurnEnd();

  requestAnimationFrame(render);
}

function updateScoreUI() {
  document.getElementById('p1Score').textContent = scores[1];
  document.getElementById('p2Score').textContent = scores[2];

  document.getElementById('p1Card').classList.toggle('active', currentPlayer === 1);
  document.getElementById('p2Card').classList.toggle('active', currentPlayer === 2);

  const dot = document.getElementById('targetDot');
  const name = document.getElementById('targetName');

  if(currentTargetSequence === 'RED') {
    dot.style.background = '#ff2d2d';
    name.textContent = 'RED (1pt)';
    name.style.color = '#ff2d2d';
  } else if(currentTargetSequence === 'COLOR') {
    dot.style.background = '#ffea00';
    name.textContent = 'ANY COLOR (2-7pt)';
    name.style.color = '#ffea00';
  } else {
    const info = SNOOKER_COLORS[currentTargetSequence];
    dot.style.background = info.color;
    name.textContent = info.name;
    // #222 black is unreadable on the dark dashboard, so the label uses a lighter grey.
    name.style.color = currentTargetSequence === 'black' ? '#b0b0b0' : info.color;
  }
}

function setStatus(msg) {
  document.getElementById('statusText').textContent = msg;
}

// Shows/hides the centered "AI THINKING" overlay on the table. Kept as its own
// call (rather than folded into isAiTurn assignments) so it stays in sync even
// if isAiTurn is ever set from a new code path later.
function setAiThinkingVisible(visible) {
  document.getElementById('aiThinkingOverlay').classList.toggle('is-active', visible);
}

function handlePointerAim(e) {
  if(isMoving || isAiTurn || isStriking || gameOver) return;
  const rect = Canvas.getBoundingClientRect();
  const mouseX = (e.clientX - rect.left) * (Canvas.width / rect.width);
  const mouseY = (e.clientY - rect.top) * (Canvas.height / rect.height);
  aimAngle = Math.atan2(mouseY - cueBall.y, mouseX - cueBall.x);
}

// Ball-in-hand: lets the player drag the cue ball anywhere inside the D before shooting.
function getCanvasXY(e) {
  const rect = Canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (Canvas.width / rect.width),
    y: (e.clientY - rect.top) * (Canvas.height / rect.height)
  };
}

// Clamps a raw x/y point into the D, returning canvas coordinates.
function clampToDXY(x, y) {
  const { along, across } = unP(x, y);
  const clamped = clampToD(along, across);
  return P(clamped.along, clamped.across);
}

// Finds a valid cue-ball position near (desiredX, desiredY): inside the D, and not
// overlapping any other ball. Tries the clamped point first, then spirals outward in
// rings, re-clamping each candidate into the D, until a clear spot is found. This is
// guaranteed to terminate correctly even deep inside a tightly packed cluster of balls
// (an iterative "push away" approach can get stuck oscillating between neighbors there).
function findValidCuePosition(desiredX, desiredY) {
  const minDist = TABLE.r * 2 + 0.5;
  const overlapsAny = (x, y) => balls.some(b => b !== cueBall && !b.inPocket && Math.hypot(x - b.x, y - b.y) < minDist);

  const first = clampToDXY(desiredX, desiredY);
  if (!overlapsAny(first.x, first.y)) return first;

  const step = TABLE.r;
  const maxRadius = Math.max(TABLE.w, TABLE.h) + step;
  for (let radius = step; radius <= maxRadius; radius += step) {
    const angleSteps = Math.max(8, Math.round((2 * Math.PI * radius) / (TABLE.r * 1.2)));
    for (let i = 0; i < angleSteps; i++) {
      const angle = (i / angleSteps) * Math.PI * 2;
      const candidate = clampToDXY(desiredX + Math.cos(angle) * radius, desiredY + Math.sin(angle) * radius);
      if (!overlapsAny(candidate.x, candidate.y)) return candidate;
    }
  }
  return first; // shouldn't happen — the D can't realistically be fully packed
}

function handleBallPlacement(e) {
  if(isMoving || isAiTurn || isStriking || gameOver) return;
  const { x, y } = getCanvasXY(e);
  const settled = findValidCuePosition(x, y);
  cueBall.x = settled.x; cueBall.y = settled.y;
  cueBall.vx = 0; cueBall.vy = 0;
}

// Bug fix: on touch devices there's no hover, so the old code fired blind on the very first
// tap (no chance to preview the shot). Touch now works like a slingshot: press+drag to aim,
// lift to fire — mirroring how a mouse hovers to aim then clicks to fire.
let touchAiming = false;

Canvas.addEventListener('pointermove', (e) => {
  if (ballInHand) {
    if (e.pointerType === 'touch' && !touchAiming) return;
    handleBallPlacement(e);
    return;
  }
  if (e.pointerType === 'touch' && !touchAiming) return;
  handlePointerAim(e);
});

Canvas.addEventListener('pointerdown', (e) => {
  if (ballInHand) {
    touchAiming = true;
    handleBallPlacement(e);
    e.preventDefault();
    return;
  }
  if (e.pointerType === 'touch') {
    touchAiming = true;
    handlePointerAim(e);
    e.preventDefault();
    return;
  }
  if (e.button === 0) {
    handlePointerAim(e);
    fireCue(document.getElementById('powerSlider').value);
  }
});

Canvas.addEventListener('pointerup', (e) => {
  if (ballInHand) {
    touchAiming = false;
    handleBallPlacement(e);
    ballInHand = false;
    setStatus('CUE BALL PLACED — AIM & FIRE');
    return;
  }
  if (e.pointerType === 'touch' && touchAiming) {
    touchAiming = false;
    handlePointerAim(e);
    fireCue(document.getElementById('powerSlider').value);
  }
});

Canvas.addEventListener('pointercancel', () => { touchAiming = false; });

Canvas.addEventListener('contextmenu', (e) => e.preventDefault());

document.getElementById('powerSlider').addEventListener('input', (e) => {
  document.getElementById('powerVal').textContent = e.target.value + '%';
});

document.getElementById('shootBtn').addEventListener('click', () => {
  if(isMoving || isAiTurn || isStriking || ballInHand) return;
  const power = document.getElementById('powerSlider').value;
  fireCue(power);
});

document.getElementById('btnVsAi').addEventListener('click', () => {
  gameMode = 'VS_AI';
  document.getElementById('p2Name').textContent = `AI (${aiDifficulty})`;
  document.getElementById('btnVsAi').classList.add('active');
  document.getElementById('btn2P').classList.remove('active');
  setupSnookerRack();
});

document.getElementById('btn2P').addEventListener('click', () => {
  gameMode = '2P';
  document.getElementById('p2Name').textContent = 'PLAYER 2';
  document.getElementById('btn2P').classList.add('active');
  document.getElementById('btnVsAi').classList.remove('active');
  setupSnookerRack();
});

document.getElementById('btnDiff').addEventListener('click', () => {
  if(aiDifficulty === 'EASY') aiDifficulty = 'MED';
  else if(aiDifficulty === 'MED') aiDifficulty = 'HARD';
  else aiDifficulty = 'EASY';

  document.getElementById('btnDiff').textContent = `DIFF: ${aiDifficulty}`;
  if(gameMode === 'VS_AI') document.getElementById('p2Name').textContent = `AI (${aiDifficulty})`;
});

document.getElementById('btnReset').addEventListener('click', setupSnookerRack);

document.getElementById('soundBtn').addEventListener('click', () => {
  const on = AudioEngine.toggleSound();
  document.getElementById('soundBtn').classList.toggle('is-on', on);
  document.getElementById('soundBtn').textContent = on ? '🔊 LOFI SOUND' : '🔇 MUTED';
});

document.addEventListener('pointerdown', () => AudioEngine.ensureStarted(), { once: true });

let resizeTimer = null;
function handleViewportChange(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(relayout, 120);
}
mqPortrait.addEventListener('change', handleViewportChange);
window.addEventListener('resize', handleViewportChange);
window.addEventListener('orientationchange', handleViewportChange);

setupSnookerRack();
render();
</script>
</body>
</html>
