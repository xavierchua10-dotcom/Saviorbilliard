<!DOCTYPE html>

<style>
  :root {
    --void: #05010f;
    --deep: #0d0122;
    --panel: rgba(16, 4, 38, 0.92);
    --pink: #ff2fd8;
    --purple: #8b2fff;
    --cyan: #23e8ff;
    --lavender: #b9a3e8;
    --text-main: #f2ecff;
    --text-muted: #a996d1;
    --felt-a: #0f5a3f;
    --felt-b: #073b28;
    --cushion: #2a140b;
    --cushion-rim: #5c2f18;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; min-height: 100vh; background: var(--void); color: var(--text-main);
    font-family: 'Rajdhani', sans-serif; display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden; padding-bottom: 2rem;
  }

  .nav-bar {
    width: 100%; max-width: 1100px; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; z-index: 10;
  }
  .back-btn {
    font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 700; color: var(--cyan);
    text-decoration: none; padding: 0.5rem 1rem; border: 1px solid var(--cyan); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    background: rgba(35, 232, 255, 0.1); transition: all 0.2s; display: flex; align-items: center; gap: 0.4rem;
  }
  .back-btn:hover { background: var(--cyan); color: var(--void); box-shadow: 0 0 15px var(--cyan); }

  .game-title {
    font-family: 'Press Start 2P', monospace; font-size: clamp(0.9rem, 2.5vw, 1.4rem); color: var(--text-main);
    text-shadow: 0 0 10px var(--pink), 0 0 20px var(--purple); margin: 0;
  }

  .sound-btn {
    background: rgba(255, 47, 216, 0.1); border: 1px solid var(--pink); color: var(--pink);
    padding: 0.5rem 0.8rem; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); transition: all 0.2s;
  }
  .sound-btn.is-on { background: rgba(35, 232, 255, 0.2); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }

  .dash {
    width: 95%; max-width: 1000px; background: var(--panel); border: 1px solid rgba(139, 47, 255, 0.4);
    border-radius: 8px; padding: 0.8rem 1.2rem; margin-bottom: 1rem; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;
    box-shadow: 0 0 20px rgba(139, 47, 255, 0.2);
  }
  .score-box { display: flex; align-items: center; gap: 1.5rem; font-family: 'Orbitron', sans-serif; }
  .player-card { display: flex; flex-direction: column; align-items: flex-start; }
  .player-card.active { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  .player-name { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }
  .player-card.active .player-name { color: var(--cyan); }
  .player-pts { font-size: 1.4rem; font-weight: 800; }
  .vs-badge { font-size: 0.8rem; color: var(--pink); font-weight: 700; }

  .status-text {
    font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: var(--pink); font-weight: 600; letter-spacing: 0.05em; text-align: center;
  }

  .mode-controls { display: flex; align-items: center; gap: 0.6rem; }
  .btn-opt {
    font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 700; padding: 0.4rem 0.8rem;
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--purple); color: var(--text-muted); cursor: pointer;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); transition: all 0.2s;
  }
  .btn-opt.active { background: var(--purple); color: #fff; border-color: var(--pink); box-shadow: 0 0 10px var(--pink); }

  .table-wrapper {
    position: relative; width: 95%; max-width: 1000px; aspect-ratio: 2 / 1; background: #000; border-radius: 12px;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), 0 0 1px 2px var(--cushion-rim); overflow: hidden; touch-action: none;
  }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }

  .controls-bar {
    width: 95%; max-width: 1000px; margin-top: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    background: var(--panel); border: 1px solid rgba(35, 232, 255, 0.3); padding: 0.8rem 1.2rem; border-radius: 8px;
  }
  .power-wrap { flex: 1; display: flex; flex-direction: column; gap: 0.3rem; }
  .power-label { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.1em; }
  .power-slider {
    width: 100%; -webkit-appearance: none; appearance: none; height: 10px; background: #1a0f30; border-radius: 5px; outline: none; border: 1px solid var(--purple);
  }
  .power-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--cyan); cursor: pointer; box-shadow: 0 0 10px var(--cyan);
  }
  .shoot-btn {
    font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 800; padding: 0.7rem 1.8rem; color: #0a0014;
    background: linear-gradient(90deg, var(--pink), var(--cyan)); border: none; cursor: pointer;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    box-shadow: 0 0 15px var(--pink); transition: transform 0.1s, box-shadow 0.2s;
  }
  .shoot-btn:active { transform: scale(0.96); }

  .target-indicator {
    display: flex; align-items: center; gap: 0.5rem; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: var(--text-main);
  }
  .ball-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,0.4); }

  @media (max-width: 600px) {
    .dash { flex-direction: column; align-items: stretch; gap: 0.6rem; }
    .score-box { justify-content: space-between; }
    .mode-controls { justify-content: center; }
  }
</style>

<script>
const AudioEngine = (function(){
  let ctx, master, isMuted = false;
  function init(){
    if(ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.2;
      master.connect(ctx.destination);
    }
  }

  function playClack(intensity = 1.0){
    if(!ctx || isMuted) return;
    if(ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1400 + Math.random()*200, now);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
    
    g.gain.setValueAtTime(0.6 * Math.min(intensity, 1), now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
    
    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + 0.05);

    const noiseLen = Math.floor(ctx.sampleRate * 0.02);
    const buf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0; i<noiseLen; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i/(noiseLen*0.2));
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 2500;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.3 * Math.min(intensity, 1), now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
    src.connect(filter);
    filter.connect(ng);
    ng.connect(master);
    src.start(now);
  }

  function playPocket(){
    if(!ctx || isMuted) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
    g.gain.setValueAtTime(0.8, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + 0.2);
  }

  let musicInterval = null;
  const CHORDS = [
    [261.63, 329.63, 392.00, 493.88],
    [220.00, 261.63, 329.63, 392.00],
    [174.61, 220.00, 261.63, 329.63],
    [196.00, 246.94, 293.66, 349.23]
  ];
  let chordIdx = 0;

  function startLofi(){
    if(musicInterval) return;
    init();
    musicInterval = setInterval(() => {
      if(!ctx || isMuted) return;
      const now = ctx.currentTime;
      const chord = CHORDS[chordIdx % CHORDS.length];
      chordIdx++;

      chord.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(0.03, now + 0.2);
        g.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
        osc.connect(g);
        g.connect(master);
        osc.start(now + i*0.05);
        osc.stop(now + 2.3);
      });
    }, 2800);
  }

  function toggleSound(){
    init();
    isMuted = !isMuted;
    if(!isMuted) startLofi();
    return !isMuted;
  }

  return { init, playClack, playPocket, startLofi, toggleSound };
})();

const Canvas = document.getElementById('gameCanvas');
const ctx = Canvas.getContext('2d');

const TABLE = {
  x: 50, y: 50, w: 900, h: 400,
  r: 10,
  friction: 0.986
};

const SNOOKER_COLORS = {
  white: { color: '#ffffff', val: 0, name: 'CUE BALL' },
  red: { color: '#e62222', val: 1, name: 'RED (1pt)' },
  yellow: { color: '#ffea00', val: 2, name: 'YELLOW (2pt)' },
  green: { color: '#00cc44', val: 3, name: 'GREEN (3pt)' },
  brown: { color: '#99592a', val: 4, name: 'BROWN (4pt)' },
  blue: { color: '#2b65ec', val: 5, name: 'BLUE (5pt)' },
  pink: { color: '#ff66cc', val: 6, name: 'PINK (6pt)' },
  black: { color: '#222222', val: 7, name: 'BLACK (7pt)' }
};

const POCKETS = [
  { x: TABLE.x, y: TABLE.y, r: 20 },
  { x: TABLE.x + TABLE.w/2, y: TABLE.y - 4, r: 18 },
  { x: TABLE.x + TABLE.w, y: TABLE.y, r: 20 },
  { x: TABLE.x, y: TABLE.y + TABLE.h, r: 20 },
  { x: TABLE.x + TABLE.w/2, y: TABLE.y + TABLE.h + 4, r: 18 },
  { x: TABLE.x + TABLE.w, y: TABLE.y + TABLE.h, r: 20 }
];

class Ball {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.type = type;
    this.info = SNOOKER_COLORS[type];
    this.inPocket = false;
    this.rotationAngle = Math.random() * Math.PI * 2;
    this.rollDir = 0;
  }

  update() {
    if(this.inPocket) return;
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= TABLE.friction;
    this.vy *= TABLE.friction;

    const speed = Math.hypot(this.vx, this.vy);
    if(speed > 0.05) {
      this.rotationAngle += speed / TABLE.r;
      this.rollDir = Math.atan2(this.vy, this.vx);
    } else {
      this.vx = 0; this.vy = 0;
    }

    const minX = TABLE.x + TABLE.r;
    const maxX = TABLE.x + TABLE.w - TABLE.r;
    const minY = TABLE.y + TABLE.r;
    const maxY = TABLE.y + TABLE.h - TABLE.r;

    if(this.x < minX) { this.x = minX; this.vx *= -0.85; AudioEngine.playClack(Math.abs(this.vx)); }
    if(this.x > maxX) { this.x = maxX; this.vx *= -0.85; AudioEngine.playClack(Math.abs(this.vx)); }
    if(this.y < minY) { this.y = minY; this.vy *= -0.85; AudioEngine.playClack(Math.abs(this.vy)); }
    if(this.y > maxY) { this.y = maxY; this.vy *= -0.85; AudioEngine.playClack(Math.abs(this.vy)); }
  }

  draw() {
    if(this.inPocket) return;
    ctx.save();

    // 1. Shadow underneath
    ctx.beginPath();
    ctx.arc(this.x + 3, this.y + 3, TABLE.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();

    // Clip to sphere
    ctx.beginPath();
    ctx.arc(this.x, this.y, TABLE.r, 0, Math.PI*2);
    ctx.clip();

    // Solid ball base color
    ctx.fillStyle = this.info.color;
    ctx.fill();

    // 2. Rotating Surface Features (Aramith Brand Stencil & Spin Seams)
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rollDir);

    const patternOffset = Math.sin(this.rotationAngle) * (TABLE.r * 0.65);
    const patternScale = Math.cos(this.rotationAngle);

    if(patternScale > -0.2) {
      ctx.save();
      ctx.translate(0, patternOffset);
      ctx.scale(1, Math.abs(patternScale));
      
      // Fine surface shine/brand dot so solid snooker balls visually spin
      ctx.fillStyle = this.type === 'white' ? '#23e8ff' : 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.arc(0, 0, 2, 0, Math.PI*2);
      ctx.fill();

      // Curved seam shadow for 3D sphere rotation
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, TABLE.r * 0.7, 0, Math.PI);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // 3. Static Specular Light Highlight (Overhead lighting stays fixed)
    const highlightGrad = ctx.createRadialGradient(
      this.x - TABLE.r*0.3, this.y - TABLE.r*0.3, 1,
      this.x, this.y, TABLE.r
    );
    highlightGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
    highlightGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0)');
    highlightGrad.addColorStop(1, 'rgba(0, 0, 0, 0.55)');

    ctx.fillStyle = highlightGrad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, TABLE.r, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

let balls = [];
let cueBall;
let aimAngle = 0;
let gameMode = 'VS_AI';
let aiDifficulty = 'MED';
let currentPlayer = 1;
let scores = { 1: 0, 2: 0 };
let currentTargetSequence = 'RED';
let pocketedThisTurn = [];
let firstBallHit = null;
let isMoving = false;
let isAiTurn = false;

let cueAnimOffset = 0;
let isStriking = false;

function setupSnookerRack() {
  balls = [];
  const centerY = TABLE.y + TABLE.h/2;
  cueBall = new Ball(230, centerY, 'white');
  balls.push(cueBall);

  balls.push(new Ball(230, centerY + 60, 'yellow'));
  balls.push(new Ball(230, centerY, 'brown'));
  balls.push(new Ball(230, centerY - 60, 'green'));
  balls.push(new Ball(TABLE.x + TABLE.w/2, centerY, 'blue'));
  balls.push(new Ball(710, centerY, 'pink'));
  balls.push(new Ball(860, centerY, 'black'));

  const startX = 725;
  for(let row=0; row<5; row++){
    for(let col=0; col<=row; col++){
      const x = startX + row * (TABLE.r * 1.8);
      const y = centerY + (col - row/2) * (TABLE.r * 2.1);
      balls.push(new Ball(x, y, 'red'));
    }
  }

  scores = { 1: 0, 2: 0 };
  currentPlayer = 1;
  currentTargetSequence = 'RED';
  updateScoreUI();
  setStatus('YOUR TURN — AIM & FIRE');
}

function resolveCollisions() {
  for(let i=0; i<balls.length; i++){
    for(let j=i+1; j<balls.length; j++){
      const b1 = balls[i];
      const b2 = balls[j];
      if(b1.inPocket || b2.inPocket) continue;

      const dx = b2.x - b1.x;
      const dy = b2.y - b1.y;
      const dist = Math.hypot(dx, dy);

      if(dist < TABLE.r * 2) {
        if(!firstBallHit && b1 === cueBall) firstBallHit = b2;
        if(!firstBallHit && b2 === cueBall) firstBallHit = b1;

        const angle = Math.atan2(dy, dx);
        const sin = Math.sin(angle), cos = Math.cos(angle);

        let vx1 = b1.vx * cos + b1.vy * sin;
        let vy1 = b1.vy * cos - b1.vx * sin;
        let vx2 = b2.vx * cos + b2.vy * sin;
        let vy2 = b2.vy * cos - b2.vx * sin;

        const finalVx1 = vx2;
        const finalVx2 = vx1;

        b1.vx = finalVx1 * cos - vy1 * sin;
        b1.vy = vy1 * cos + finalVx1 * sin;
        b2.vx = finalVx2 * cos - vy2 * sin;
        b2.vy = vy2 * cos + finalVx2 * sin;

        const overlap = (TABLE.r * 2) - dist;
        b1.x -= (overlap/2) * cos;
        b1.y -= (overlap/2) * sin;
        b2.x += (overlap/2) * cos;
        b2.y += (overlap/2) * sin;

        const speed = Math.hypot(b1.vx - b2.vx, b1.vy - b2.vy);
        AudioEngine.playClack(speed / 5);
      }
    }
  }
}

function checkPockets() {
  balls.forEach(b => {
    if(b.inPocket) return;
    POCKETS.forEach(p => {
      if(Math.hypot(b.x - p.x, b.y - p.y) < p.r) {
        b.inPocket = true;
        b.vx = 0; b.vy = 0;
        pocketedThisTurn.push(b);
        AudioEngine.playPocket();
      }
    });
  });
}

function checkTurnEnd() {
  const moving = balls.some(b => !b.inPocket && (Math.abs(b.vx) > 0 || Math.abs(b.vy) > 0));
  if(isMoving && !moving && !isStriking) {
    isMoving = false;
    processShotResults();
  }
}

function processShotResults() {
  let switchTurn = true;
  let pointsAwarded = 0;

  const redLeft = balls.some(b => b.type === 'red' && !b.inPocket);

  if(cueBall.inPocket) {
    setStatus(`FOUL! Cue ball potted. -4 pts.`);
    scores[currentPlayer === 1 ? 2 : 1] += 4;
    cueBall.inPocket = false;
    cueBall.x = 230; cueBall.y = TABLE.y + TABLE.h/2; cueBall.vx = 0; cueBall.vy = 0;
  } else {
    let validPotted = pocketedThisTurn.filter(b => b.type !== 'white');

    if(validPotted.length > 0) {
      const pBall = validPotted[0];
      if(currentTargetSequence === 'RED' && pBall.type === 'red') {
        pointsAwarded = 1;
        currentTargetSequence = 'COLOR';
        switchTurn = false;
        setStatus(`POTTED RED! +1 pt. Select Color next.`);
      } else if(currentTargetSequence === 'COLOR' && pBall.type !== 'red') {
        pointsAwarded = pBall.info.val;
        currentTargetSequence = redLeft ? 'RED' : 'COLOR';
        switchTurn = false;
        setStatus(`POTTED ${pBall.info.name}! +${pointsAwarded} pts.`);
        if(redLeft) {
          setTimeout(() => { pBall.inPocket = false; pBall.x = 500; pBall.y = TABLE.y + TABLE.h/2; }, 400);
        }
      } else {
        setStatus(`FOUL! Wrong ball sequence.`);
        scores[currentPlayer === 1 ? 2 : 1] += 4;
      }
    }
  }

  scores[currentPlayer] += pointsAwarded;
  pocketedThisTurn = [];
  firstBallHit = null;

  if(switchTurn) {
    currentPlayer = currentPlayer === 1 ? 2 : 1;
  }

  updateScoreUI();

  if(gameMode === 'VS_AI' && currentPlayer === 2) {
    setTimeout(triggerAiTurn, 800);
  }
}

function triggerAiTurn() {
  if(isMoving) return;
  isAiTurn = true;
  setStatus('AI THINKING...');

  setTimeout(() => {
    const targetType = currentTargetSequence === 'RED' ? 'red' : 'yellow';
    const targets = balls.filter(b => !b.inPocket && (targetType === 'red' ? b.type === 'red' : b.type !== 'white' && b.type !== 'red'));
    
    let bestTarget = targets[Math.floor(Math.random() * targets.length)] || balls[1];
    let angle = Math.atan2(bestTarget.y - cueBall.y, bestTarget.x - cueBall.x);

    let error = 0;
    if(aiDifficulty === 'EASY') error = (Math.random() - 0.5) * 0.35;
    if(aiDifficulty === 'MED') error = (Math.random() - 0.5) * 0.15;
    if(aiDifficulty === 'HARD') error = (Math.random() - 0.5) * 0.04;

    aimAngle = angle + error;
    const power = 40 + Math.random() * 40;

    fireCue(power);
    isAiTurn = false;
  }, 1000);
}

function fireCue(powerPercent) {
  if(isMoving || isStriking) return;
  isStriking = true;

  const power = (powerPercent / 100) * 22;
  const startOffset = 20 + (powerPercent / 100) * 40;

  let currentOffset = startOffset;
  const strikeInterval = setInterval(() => {
    currentOffset -= 8;
    cueAnimOffset = currentOffset;
    if(currentOffset <= 10) {
      clearInterval(strikeInterval);
      cueAnimOffset = 0;
      isStriking = false;
      cueBall.vx = Math.cos(aimAngle) * power;
      cueBall.vy = Math.sin(aimAngle) * power;
      isMoving = true;
      firstBallHit = null;
      pocketedThisTurn = [];
      AudioEngine.playClack(power / 10);
    }
  }, 16);
}

function render() {
  ctx.clearRect(0, 0, Canvas.width, Canvas.height);

  ctx.fillStyle = '#2a140b';
  ctx.fillRect(0, 0, Canvas.width, Canvas.height);
  ctx.fillStyle = '#5c2f18';
  ctx.fillRect(35, 35, 930, 430);

  ctx.fillStyle = '#0f5a3f';
  ctx.fillRect(TABLE.x, TABLE.y, TABLE.w, TABLE.h);

  const centerY = TABLE.y + TABLE.h/2;
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(230, TABLE.y);
  ctx.lineTo(230, TABLE.y + TABLE.h);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(230, centerY, 60, Math.PI/2, Math.PI * 1.5);
  ctx.stroke();

  POCKETS.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = '#0a0a0a';
    ctx.fill();
    ctx.strokeStyle = '#3a2010';
    ctx.lineWidth = 3;
    ctx.stroke();
  });

  if(!isMoving && !cueBall.inPocket) {
    const powerVal = parseInt(document.getElementById('powerSlider').value);
    const baseDistance = isStriking ? cueAnimOffset : 15 + (powerVal / 100) * 35;

    ctx.save();
    ctx.strokeStyle = 'rgba(35, 232, 255, 0.6)';
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cueBall.x, cueBall.y);
    ctx.lineTo(cueBall.x + Math.cos(aimAngle) * 300, cueBall.y + Math.sin(aimAngle) * 300);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(cueBall.x, cueBall.y);
    ctx.rotate(aimAngle + Math.PI);
    ctx.fillStyle = '#d4a359';
    ctx.fillRect(baseDistance, -3, 220, 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(baseDistance, -3, 8, 6);
    ctx.restore();
  }

  balls.forEach(b => b.update());
  resolveCollisions();
  checkPockets();
  balls.forEach(b => b.draw());
  checkTurnEnd();

  requestAnimationFrame(render);
}

function updateScoreUI() {
  document.getElementById('p1Score').textContent = scores[1];
  document.getElementById('p2Score').textContent = scores[2];

  document.getElementById('p1Card').classList.toggle('active', currentPlayer === 1);
  document.getElementById('p2Card').classList.toggle('active', currentPlayer === 2);

  const dot = document.getElementById('targetDot');
  const name = document.getElementById('targetName');

  if(currentTargetSequence === 'RED') {
    dot.style.background = '#ff2d2d';
    name.textContent = 'RED (1pt)';
    name.style.color = '#ff2d2d';
  } else {
    dot.style.background = '#ffea00';
    name.textContent = 'ANY COLOR (2-7pt)';
    name.style.color = '#ffea00';
  }
}

function setStatus(msg) {
  document.getElementById('statusText').textContent = msg;
}

function handlePointerAim(e) {
  if(isMoving || isAiTurn || isStriking) return;
  const rect = Canvas.getBoundingClientRect();
  const mouseX = (e.clientX - rect.left) * (Canvas.width / rect.width);
  const mouseY = (e.clientY - rect.top) * (Canvas.height / rect.height);
  aimAngle = Math.atan2(mouseY - cueBall.y, mouseX - cueBall.x);
}

Canvas.addEventListener('pointermove', handlePointerAim);

Canvas.addEventListener('pointerdown', (e) => {
  if (e.button === 0) {
    handlePointerAim(e);
    if (!isMoving && !isAiTurn && !isStriking) {
      fireCue(document.getElementById('powerSlider').value);
    }
  }
});

Canvas.addEventListener('contextmenu', (e) => e.preventDefault());

document.getElementById('powerSlider').addEventListener('input', (e) => {
  document.getElementById('powerVal').textContent = e.target.value + '%';
});

document.getElementById('shootBtn').addEventListener('click', () => {
  if(isMoving || isAiTurn || isStriking) return;
  const power = document.getElementById('powerSlider').value;
  fireCue(power);
});

document.getElementById('btnVsAi').addEventListener('click', () => {
  gameMode = 'VS_AI';
  document.getElementById('p2Name').textContent = `AI (${aiDifficulty})`;
  document.getElementById('btnVsAi').classList.add('active');
  document.getElementById('btn2P').classList.remove('active');
  setupSnookerRack();
});

document.getElementById('btn2P').addEventListener('click', () => {
  gameMode = '2P';
  document.getElementById('p2Name').textContent = 'PLAYER 2';
  document.getElementById('btn2P').classList.add('active');
  document.getElementById('btnVsAi').classList.remove('active');
  setupSnookerRack();
});

document.getElementById('btnDiff').addEventListener('click', () => {
  if(aiDifficulty === 'EASY') aiDifficulty = 'MED';
  else if(aiDifficulty === 'MED') aiDifficulty = 'HARD';
  else aiDifficulty = 'EASY';

  document.getElementById('btnDiff').textContent = `DIFF: ${aiDifficulty}`;
  if(gameMode === 'VS_AI') document.getElementById('p2Name').textContent = `AI (${aiDifficulty})`;
});

document.getElementById('btnReset').addEventListener('click', setupSnookerRack);

document.getElementById('soundBtn').addEventListener('click', () => {
  const on = AudioEngine.toggleSound();
  document.getElementById('soundBtn').classList.toggle('is-on', on);
  document.getElementById('soundBtn').textContent = on ? '🔊 LOFI SOUND' : '🔇 MUTED';
});

setupSnookerRack();
render();
</script>
